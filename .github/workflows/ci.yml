name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to the same PR/branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Go build cache is content-addressed, so a cache from an older go.sum is
# still mostly valid: restore-keys turn a dependency bump into a warm build
# instead of a cold Trivy compile (~12 min). Only `check` saves it; the other
# jobs restore it.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # make check builds the UI (embed) before go build.
      - run: make check

  # The smoke test drives the built binary in Chromium. `make check` must not
  # download a browser, so this job installs one and runs the five-page test.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # bastion scans its own repository. testdata holds intentional fixture
  # vulnerabilities, so it is skipped. SARIF upload to code scanning needs extra
  # permissions and arrives with the Phase 4 GitHub Action.
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # The Trivy DB is ~1.7 GB; refresh it weekly.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bastion/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.week.outputs.key }}
      - run: make build
      - name: scan
        run: |
          export BASTION_HMAC_KEY="$(openssl rand -base64 32)"
          ./bin/bastion --cache-dir "$HOME/.cache/bastion" scan --path . --no-store \
            --skip-dirs testdata --format sarif --fail-on critical > bastion.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bastion-sarif
          path: bastion.sarif

  # Compile-only check of the release targets on master pushes. PRs skip it
  # (it is not a required check and the tag-triggered release builds all six
  # anyway). `go build ./...` over several packages compiles without linking,
  # so the runner no longer runs out of disk and the UI build is not needed:
  # an empty web/dist satisfies the embed.
  cross-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Saves module downloads; compiled objects are per GOOS/GOARCH. The path
      # list must match check's save or the cache version differs.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath ./...
