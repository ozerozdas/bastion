        "500":
          $ref: "#/components/responses/Problem"
  /api/assets:
    get:
      operationId: listAssets
      summary: List tracked assets.
      description: |
        Every non-archived asset with its newest scan (whatever its status) and
        the open severity counts of its newest succeeded scan. `open_counts`
        uses the dashboard scope: any `finding_states` decision hides its
        finding, and a failed or running newest scan does not shadow the last
        complete report.
      tags: [assets]
      responses:
        "200":
          description: The tracked assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAsset
      summary: Track a repository or a local path.
      description: |
        `repo` resolves the repository's default branch through GitHub with the
        connection's token (`connection_id`, else the default GitHub token) and
        stores it. `path` must be an existing absolute directory.

        Re-adding an archived asset revives that row instead of creating a
        second one: its history, scans and finding decisions stay attached to
        the same id, which fingerprints depend on.
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: The asset was created or revived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: |
            The kind, ref or path is invalid, or a repo asset's default branch
            could not be resolved because GitHub rejected the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The connection id does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            The asset already exists or the connection has no token; the detail
            says which.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          description: GitHub failed the request; the detail carries the hint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/assets/{id}:
    delete:
      operationId: deleteAsset
      summary: Archive an asset.
      description: |
        Soft delete: the row, its scans and its findings stay in the database,
        but the asset disappears from the lists, the dashboard and new scans.
      tags: [assets]
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "204":
          description: The asset is archived.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/assets/{id}/fix-plan:
    get:
      operationId: getAssetFixPlan
      summary: Fix plan of one asset.
      description: |
        Groups the asset's open vulnerability findings into package upgrades
        (PROJECT_SPEC.md §7.2, §8 Phase 3). "Open" means the same as
        `GET /api/findings`: the asset's most recent succeeded scan, with every
        `finding_states` decision excluded.

        A step is one upgrade that closes all its findings: each finding
        contributes the smallest fixed version above its installed one, and the
        step takes the highest of those, so the target satisfies every advisory
        at once. `approximate` is true when no ecosystem-specific version
        comparison decided the target, so its order is a best effort rather
        than authoritative. Findings no upgrade closes are listed in `no_fix`.

        Steps are ordered by their prioritization score (#29), highest first:
        the severity weight sum times the EPSS and latest-image multipliers.
        Each step carries that score and the factors behind it, so the ordering
        is explainable; ties keep the critical, then high, then total-count
        order.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: The asset's fix plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixPlan"
        "400":
          description: The asset id is not a positive integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The asset does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/assets/{id}/fix-plan/pull-request:
    post:
      operationId: openFixPlanPullRequest
      summary: Open a GitHub pull request for one fix plan step.
      description: |
        Manifest only (#47): bastion edits `go.mod` or `package.json` through
        the GitHub REST API, on a new branch, and opens a pull request against
        the repository's default branch. It never clones the repository and
        never runs a package manager. The lockfile is left untouched, so it
        must be regenerated (`go mod tidy` / `npm install`) before merging.

        The request is refused unless `confirm` is `true`: nothing is written to
        GitHub without an explicit confirmation. `ecosystem`, `package` and
        `target` must match a step of the asset's current fix plan exactly;
        bastion recomputes the plan and never trusts a client-supplied version.

        `{id}` must be a repository asset with a GitHub connection whose token
        may write contents and pull requests (classic `repo`, or fine-grained
        *Contents: write* and *Pull requests: write*). A package that appears
        only in the lockfile is a transitive dependency: the step is refused
        with `422` instead of guessing which manifest entry to bump.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixPlanPullRequestRequest"
      responses:
        "201":
          description: The pull request that was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixPlanPullRequestResult"
        "400":
          description: |
            `confirm` is not true, a field is empty, the asset id is not a
            positive integer, or no step of the current plan matches
            `ecosystem`, `package` and `target`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The asset does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            The branch already exists. `pr_url` carries the URL of the open
            pull request for it when there is one.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "422":
          description: |
            The asset cannot get a pull request (not a repository, no GitHub
            connection, unsupported ecosystem), the package is only a
            transitive dependency, or its location names no supported manifest.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          description: GitHub failed the request; the detail carries the hint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/assets/{id}/link:
    put:
      operationId: setAssetLink
      summary: Link an image to the repository it was built from.
      description: |
        `{id}` is the image asset. The link replaces any previous one for that
        image, including a link the image's OCI labels created, and is marked
        `manual`: a later scan never overwrites it. Both assets must exist and
        the pair must be an image and a repository.
      tags: [assets]
      parameters:
        - $ref: "#/components/parameters/AssetID"
