openapi: 3.1.0
info:
  title: Bastion API
  version: 0.0.0
  summary: Local-first security center — local HTTP API.
  description: |
    Bastion's HTTP API is served by the `bastion serve` process on
    `127.0.0.1:<port>` only (PROJECT_SPEC.md §4.3). There is no remote access,
    no CORS and no API key: every `/api/*` request must carry the
    `bastion_session` cookie that the server issued after exchanging the
    single-use startup token, and mutating requests must also send
    `X-Bastion: 1`.

    Errors are RFC 9457 problem details (`application/problem+json`).

    This file is the authoritative contract (PROJECT_SPEC.md §6, §9): change it
    first, then run `make gen` to regenerate the Go server stubs and the
    TypeScript types.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:{port}
    description: Loopback only. The port is chosen at startup unless `--port` is given.
    variables:
      port:
        default: "0"
        description: Ephemeral port printed by `bastion serve` on start.
tags:
  - name: system
    description: Process and API liveness.
  - name: mcp
    description: |
      Copy-ready client configuration for `bastion mcp`, the read-only Model
      Context Protocol server over stdio. The response names the running
      binary and the arguments that start it against the same data directory
      as `bastion serve`; it performs no I/O itself.
  - name: update
    description: |
      The opt-in release check (ADR-006). Consent, not the database, decides
      whether bastion may contact github.com; `unset` and `off` send nothing.
      `GET /api/update` never blocks on the network.
  - name: trivy-db
    description: |
      The Trivy vulnerability DB a scan needs. `GET /api/trivy-db` never blocks
      on the network; `POST /api/trivy-db/download` starts one download and is
      idempotent while a download is in flight.
  - name: epss
    description: |
      The opt-in FIRST.org EPSS feed: the probability that a CVE is exploited
      in the next 30 days. Off by default; with the setting off no request is
      made. When on, the gzipped CSV is cached and refreshed at most daily, and
      findings carry its score at read time. `GET /api/epss` never blocks on
      the network.
  - name: outdated
    description: |
      The opt-in outdated-package lookup (#38). When on, a scan asks
      api.deps.dev for the default (latest) version of each supported package
      in its inventory and reports an `outdated` finding when the installed
      version is older. Off by default; with the setting off no request is
      made. Only the ecosystem and package name are sent. `GET /api/outdated`
      never blocks on the network.
  - name: eol
    description: |
      The opt-in end-of-life lookup (#55). When on, a scan asks endoflife.date
      for the release cycles of the detected operating system and Go runtime
      and reports an `outdated` finding naming the end-of-life date. Off by
      default; with the setting off no request is made. Only the product name
      is sent. `GET /api/eol` never blocks on the network.
  - name: reachability
    description: |
      The opt-in Go reachability enrichment (#37). When on, a scan of a Go
      module runs govulncheck and marks each Go vulnerability finding
      `reachable`, `unreachable` or `unknown`. Off by default; with the setting
      off nothing runs and findings carry no reachability. A scan that cannot
      run govulncheck (no `go` on PATH, network failure) still succeeds and
      reports `unknown`.
  - name: sast
    description: |
      The opt-in SAST module (#33): a pinned Opengrep binary and rule set,
      downloaded from GitHub only after the user turns it on. Off by default;
      with the setting off no download happens and repository scans are
      unchanged. Turning it on starts one background download and later
      repository scans include `sast` findings; image scans never do.
      `GET /api/sast` never blocks on the network.
  - name: connections
    description: |
      Credentialed integrations used to discover and fetch sources. Tokens live
      in the OS keyring (never in SQLite) and are never returned by the API.
  - name: docker
    description: |
      The local Docker daemon. Bastion reads the images it already holds and
      never pulls, builds or runs anything.
  - name: assets
    description: |
      The repositories, local paths and local images bastion tracks. Archiving
      is a soft delete: history and findings stay readable.
  - name: scans
    description: |
      Scan queue and history. Scans run in the server's worker pool; every scan
      is cancelable until it finishes.
  - name: findings
    description: |
      Normalized findings across assets. The list endpoints report each asset's
      most recent succeeded scan; `status` is the effective status, so a
      finding_states decision shows up as `ignored`.
  - name: licence-policy
    description: |
      The licence allow/deny policy (#39). A rule is global when `asset_id` is
      omitted, or belongs to one asset. An allow rule hides a matching licence
      finding from the findings list, grouped view, counts and export; a deny
      rule keeps it and raises its severity to at least `high`. A per-asset rule
      overrides a global one for the same licence. Matching is exact on the
      licence string as the scanner reports it: `MIT OR Apache-2.0` is its own
      entry, not two rules.
  - name: preferences
    description: |
      Per-install UI preferences (#150): the theme, the language and the
      dashboard dismissals. They are keyed by the localStorage key the UI uses,
      so the browser cache and the server copy stay interchangeable. The
      whitelist is fixed: an unknown key is rejected rather than stored.
  - name: notifications
    description: |
      Scan notifications (#44/#45/#46). After a scan succeeds, bastion diffs it
      against the asset's previous succeeded scan and posts the new counts to
      every enabled notifier when at least one new finding meets the threshold.
      The first scan of an asset sends nothing. The Slack webhook and the SMTP
      password are stored in the OS keyring and never returned: the API only
      reports whether each is configured.
  - name: llm
    description: |
      The optional local LLM (ADR-003, #48). Off by default. When enabled,
      bastion posts one finding to an OpenAI-compatible endpoint on the
      loopback interface and returns the model's explanation. The endpoint
      must be an http(s) URL on a loopback IP literal or `localhost`; nothing
      is resolved and no other host is accepted. Target-derived text travels
      as delimited untrusted data, and the answer is advisory only: it never
      triggers an action.
  - name: reports
    description: |
      Aggregates for the Dashboard (PROJECT_SPEC.md §7.1). Every number counts
      open findings of each non-archived asset's latest succeeded scan.
security:
  - sessionCookie: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness and version probe.
      description: |
        Returns `ok` once the HTTP API is serving requests. Used by the web UI
        on boot and by `bastion doctor`-style checks; it performs no I/O.
      tags: [system]
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/mcp:
    get:
      operationId: getMCPSetup
      summary: Report the command that starts the MCP server.
      description: |
        Returns the absolute path of the running binary and the arguments that
        start `bastion mcp` against the same data directory as this server.
        The Configuration modal renders the command as copy-ready snippets for
        the supported MCP clients. Nothing is written and no process starts.
      tags: [mcp]
      responses:
        "200":
          description: The command and arguments to start the MCP server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPSetup"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/update:
    get:
      operationId: getUpdateStatus
      summary: Report the release check state.
      description: |
        Returns the running version, the stored consent and the cached check
        result. With consent `unset` or `off` no request is made. With consent
        `on`, a cached result older than 24 hours is refreshed in the
        background; this response carries the cached values immediately.
      tags: [update]
      responses:
        "200":
          description: The current release check state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/update/consent:
    put:
      operationId: setUpdateConsent
      summary: Store the release-check choice.
      description: |
        Only the UI calls this. `enabled: false` stops every future request;
        the choice lives in a small file in the data directory, so no database
        migration is involved. The response is the updated status.
      tags: [update]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUpdateConsentRequest"
      responses:
        "200":
          description: The choice was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/trivy-db:
    get:
      operationId: getTrivyDB
      summary: Report the vulnerability DB state.
      description: |
        Returns the state of the Trivy vulnerability DB a scan needs: `missing`
        when it is not on disk, `downloading` while a download runs, `ready`
        when it is usable, `failed` when the last download failed. This endpoint
        never waits for a download.
      tags: [trivy-db]
      responses:
        "200":
          description: The current DB state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrivyDBStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/trivy-db/download:
    post:
      operationId: downloadTrivyDB
      summary: Start a vulnerability DB download.
      description: |
        Starts one download in the background and returns the state it started
        in (`downloading`). It is idempotent: while a download is in flight,
        whatever started it, the call starts no second one and reports that
        download's state. Scans wait for the DB themselves, so downloading
        ahead of time only shortens them.
      tags: [trivy-db]
      responses:
        "202":
          description: A download is in flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrivyDBStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/epss:
    get:
      operationId: getEPSSStatus
      summary: Report the EPSS feed state.
      description: |
        Returns the stored opt-in setting and the cached feed: when it was last
        downloaded, the feed's own score date and how many CVEs it scores. With
        the setting off no request is made. With it on, a cache older than 24
        hours is refreshed in the background; this response carries the cached
        values immediately.
      tags: [epss]
      responses:
        "200":
          description: The current EPSS feed state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EPSSStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setEPSSEnabled
      summary: Store the EPSS opt-in choice.
      description: |
        Only the UI calls this. `enabled: false` stops every future request and
        leaves findings without a score. Turning it on starts a download when
        no fresh cache exists; the response is the updated status.
      tags: [epss]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEPSSEnabledRequest"
      responses:
        "200":
          description: The choice was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EPSSStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/outdated:
    get:
      operationId: getOutdatedStatus
      summary: Report the outdated-package lookup state.
      description: |
        Returns the stored opt-in setting only. With the setting off no request
        reaches deps.dev and findings carry no latest version. The handler never
        blocks on the network.
      tags: [outdated]
      responses:
        "200":
          description: The current outdated-package lookup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutdatedStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setOutdatedEnabled
      summary: Store the outdated-package opt-in choice.
      description: |
        Only the UI calls this. `enabled: false` stops future scans from asking
        deps.dev and leaves findings without a latest version. Turning it on
        affects the next scan; the response is the updated status.
      tags: [outdated]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOutdatedEnabledRequest"
      responses:
        "200":
          description: The choice was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutdatedStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/eol:
    get:
      operationId: getEOLStatus
      summary: Report the end-of-life lookup state.
      description: |
        Returns the stored opt-in setting only. The handler never blocks on the
        network.
      tags: [eol]
      responses:
        "200":
          description: The current end-of-life lookup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EOLStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setEOLEnabled
      summary: Store the end-of-life lookup opt-in choice.
      description: |
        Only the UI calls this. The choice affects the next scan; the response
        is the updated status.
      tags: [eol]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEOLEnabledRequest"
      responses:
        "200":
          description: The choice was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EOLStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/reachability:
    get:
      operationId: getReachabilityStatus
      summary: Report the Go reachability enrichment state.
      description: |
        Returns the stored opt-in setting and whether a Go toolchain was found
        on PATH. With the setting off no govulncheck process runs and findings
        carry no reachability. The check reads the filesystem only; no request
        is made.
      tags: [reachability]
      responses:
        "200":
          description: The current reachability enrichment state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachabilityStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setReachabilityEnabled
      summary: Store the Go reachability opt-in choice.
      description: |
        Only the UI calls this. `enabled: false` stops future scans from running
        govulncheck and leaves findings without a reachability. Turning it on
        affects the next scan; the response is the updated status.
      tags: [reachability]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetReachabilityEnabledRequest"
      responses:
        "200":
          description: The choice was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachabilityStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/sast:
    get:
      operationId: getSASTStatus
      summary: Report the SAST module state.
      description: |
        Returns the stored opt-in setting, the installed state of the pinned
        Opengrep module and whether a download is running. The handler reads
        the filesystem only; no request is made.
      tags: [sast]
      responses:
        "200":
          description: The current SAST module state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SASTStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setSASTEnabled
      summary: Store the SAST opt-in choice.
      description: |
        Only the UI calls this. `enabled: true` stores the choice and starts the
        one-time download of the pinned binary and rule set in the background;
        the response reports `installing`. `enabled: false` stops future
        repository scans from running SAST and never cancels a download that is
        already running.
      tags: [sast]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSASTEnabledRequest"
      responses:
        "200":
          description: The choice was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SASTStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/connections:
    get:
      operationId: listConnections
      summary: List configured connections.
      description: |
        Returns every connection, ordered by kind and name. Tokens and keyring
        references are never part of the response.
      tags: [connections]
      responses:
        "200":
          description: The configured connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createConnection
      summary: Add a connection and test it.
      description: |
        A GitHub connection stores its token in the OS keyring under
        `bastion.connection.<id>` and is tested with `GET /user`. An AWS
        connection stores only a profile name and a region and is tested with
        STS `GetCallerIdentity`; its credentials come from the AWS SDK's default
        chain and are never stored.

        A failed test still creates the connection: it is returned with
        `status: error` and a human-readable `hint`, so the user can correct the
        profile or token without losing the entry. If the token cannot be
        stored, the row is removed again and no connection is created.
      tags: [connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: The connection was created (and tested).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: A connection with the same kind and name already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/connections/{id}:
    patch:
      operationId: renameConnection
      summary: Rename a connection.
      description: |
        Changes the user-chosen name. The name is trimmed and must not be empty
        or already used by another connection of the same kind. Nothing else
        about the connection changes: its kind, status, identity and credential
        stay as they were.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameConnectionRequest"
      responses:
        "200":
          description: The connection with its new name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: A connection with the same kind and name already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteConnection
      summary: Remove a connection and its stored secret.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "204":
          description: The connection and its keyring entry were removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Test a connection and record the result.
      description: |
        GitHub connections call `GET /user` with the stored token; AWS
        connections call STS `GetCallerIdentity` with credentials from the SDK's
        default chain. Either way `status`, `last_checked_at` and the identity
        (`login`, or `account` and `arn`) are recorded in the connection's
        non-secret config. A failed test returns the connection with
        `status: error` and a `hint`; it is not an API error.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: The connection after the test, successful or not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/connections/{id}/discover:
    get:
      operationId: discoverConnectionRepos
      summary: List what the connection can add.
      description: |
        For a `github` connection, calls GitHub's repository list and returns
        `repos`, marking the ones that already exist as assets with
        `already_added: true`. For an `aws` connection, returns
        `ecr_repositories` with each repository's newest tags and digests and
        marks the digest-pinned images already tracked as assets. The arrays
        are empty when they do not apply.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: Repositories and ECR images visible to the connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverReposResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: The connection has no token and the environment fallback is unset.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
