        - $ref: "#/components/parameters/AssetID"
      responses:
        "204":
          description: The image has no link.
        "400":
          description: The id is not usable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/assets/{id}/schedule:
    put:
      operationId: setAssetSchedule
      summary: Set how often an asset is scanned.
      description: |
        `{id}` is the asset. The schedule is `off` (never on a schedule),
        `daily` (every 24 hours) or `weekly` (every 7 days), and runs only while
        `bastion serve` is open. Missed runs are not backfilled: the server
        checks once at startup and then every five minutes, so a run missed
        while it was closed happens once at the next start. Notifications apply
        as for any scan.
      tags: [assets]
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAssetScheduleRequest"
      responses:
        "200":
          description: The asset with its new schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: The schedule is not one of `off`, `daily` or `weekly`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The asset does not exist or is archived.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans:
    get:
      operationId: listScans
      summary: List scans, newest first.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/AssetIDQuery"
        - $ref: "#/components/parameters/ScanLimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/ScanSortQuery"
        - $ref: "#/components/parameters/SortOrderQuery"
      responses:
        "200":
          description: One page of scans after the filters, with the total count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanList"
        "400":
          description: The asset id, limit or offset is not usable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createScans
      summary: Queue scans of one or more assets.
      description: |
        Every asset id is checked before anything is queued: an unknown or
        archived asset fails the whole request, so the caller never receives a
        partial batch it cannot correlate. The scans run in the server's worker
        pool with `trigger: ui` and can be canceled individually.
      tags: [scans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScansRequest"
      responses:
        "202":
          description: The scans are queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanQueueResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: An asset id does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An asset is archived and cannot be scanned.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans/{id}:
    get:
      operationId: getScan
      summary: One scan with its scanner runs.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/ScanID"
      responses:
        "200":
          description: The scan, including `scanner_runs`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans/{id}/cancel:
    post:
      operationId: cancelScan
      summary: Cancel a queued or running scan.
      description: |
        A queued scan is persisted as canceled before this responds; a running
        scan stops at its next check and its worker persists the final state.
        The body is the scan as it stood when the request was accepted.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/ScanID"
      responses:
        "200":
          description: The scan after the cancel request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: The scan is already finished or canceled.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans/{id}/findings:
    get:
      operationId: listScanFindings
      summary: Findings of one scan.
      description: |
        Every finding the scan produced, most severe first, with the effective
        status: a `finding_states` decision for the same asset and fingerprint
        reports the finding as `ignored` and fills `state` and `reason`.

        `offset` skips rows; the endpoint has no page size, so `total` counts
        every matching finding and `limit` is `0`.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/ScanID"
        - $ref: "#/components/parameters/SeverityQuery"
        - $ref: "#/components/parameters/FindingTypeQuery"
        - $ref: "#/components/parameters/FindingStatusQuery"
        - $ref: "#/components/parameters/OffsetQuery"
      responses:
        "200":
          description: The findings after the filters, from the offset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "400":
          description: A query parameter is not a valid enum value.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans/{id}/diff:
    get:
      operationId: getScanDiff
      summary: Findings new, fixed and persisting between two scans.
      description: |
        Compares `{id}` with `against`, or with the asset's previous succeeded
        scan (the newest succeeded scan older than `{id}`) when `against` is
        omitted. Both scans must be succeeded scans of the same asset: a
        `queued`, `running`, `failed` or `canceled` scan has no complete finding
        set to compare.

        With nothing to compare against — the asset's first succeeded scan —
        the response is still `200`: `against_scan_id` is absent, every finding
        of `{id}` is reported as `new`, and `fixed`, `persisting` and their
        counts are empty.

        Findings are matched by fingerprint. Each group is most severe first,
        then in the order `GET /api/scans/{id}/findings` returns them.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/ScanID"
        - name: against
          in: query
          required: false
          description: |
            Scan to compare against. Must be a succeeded scan of the same asset.
            Defaults to the previous succeeded scan of the asset.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: |
            The diff, or every finding as new when there is no previous
            succeeded scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanDiff"
        "400":
          description: |
            `against` is not a positive scan id, is `{id}`, or belongs to a
            different asset.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: |
            `{id}` or `against` does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            `{id}` or `against` did not succeed, so it has no complete finding
            set.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans/{id}/sbom:
    get:
      operationId: getScanSBOM
      summary: CycloneDX SBOM of one succeeded scan.
      description: |
        The package inventory the scan persisted, as a CycloneDX 1.6 JSON BOM
        served as a download (`application/vnd.cyclonedx+json`,
        `Content-Disposition: attachment`). Components are the packages the
        scan reported, sorted and de-duplicated; each carries its purl when the
        scanner reported one or bastion can derive it. The document does not
        include vulnerabilities.

        This operation is hand-written in `internal/httpapi/sbom.go` and
        excluded from codegen (api/oapi-codegen.yaml): the generated strict
        server cannot set the `Content-Disposition` header. Like
        `/api/events`, the spec stays the contract.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/ScanID"
      responses:
        "200":
          description: The BOM of the scan.
          headers:
            Content-Disposition:
              description: |
                Attachment with the filename
                `<display-name>-scan-<id>.cdx.json` (unsafe characters replaced).
              schema:
                type: string
          content:
            application/vnd.cyclonedx+json:
              schema:
                type: object
                description: A CycloneDX 1.6 JSON BOM.
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The scan does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            The scan did not succeed, so it has no complete package inventory.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/findings/state:
    post:
      operationId: setFindingStates
      summary: Record one decision for many findings of one asset.
      description: |
        One decision (state and reason) applies to every named fingerprint of
        the asset, in a single transaction. If any fingerprint is not a finding
        of the asset, nothing is written and `fingerprints` names the unknown
        ones. At most 5000 fingerprints per request. Decisions are keyed on
        (asset_id, fingerprint), exactly as with the single-finding endpoint.
      tags: [findings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSetFindingStateRequest"
      responses:
        "204":
          description: The decision is stored for every fingerprint.
        "400":
          description: |
            The state is unknown, the reason is blank, the list is empty or
            longer than 5000, a fingerprint is blank, or expires_at is not a
            timestamp/date in the future.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: |
            The asset id does not exist, or a fingerprint is not a finding of
            it. Nothing was written; the problem's `fingerprints` extension
            member lists the unknown fingerprints.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/findings/{fingerprint}/state:
    post:
      operationId: setFindingState
      summary: Record a decision for one finding.
      description: |
        Decisions are keyed on (asset_id, fingerprint), so they hide the finding
        in this scan and in every later one that rediscovers it. `reason` is
        required: a hidden finding must stay reviewable. Re-deciding replaces
        the previous state and reason.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/Fingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFindingStateRequest"
      responses:
        "204":
          description: The decision is stored.
        "400":
          description: |
            The state is unknown, the reason is blank, ids are missing, or
            expires_at is not a timestamp/date in the future.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The asset id does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearFindingState
      summary: Clear the decision for one finding.
      description: |
        Clearing is a DELETE with `asset_id` in the query, because the decision
        key is (asset_id, fingerprint) and both are needed to identify it.
        Clearing a decision that does not exist succeeds.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/Fingerprint"
        - $ref: "#/components/parameters/AssetIDRequiredQuery"
      responses:
        "204":
          description: No decision is stored for the fingerprint any more.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The asset id does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/findings:
    get:
      operationId: listFindings
      summary: Latest findings across assets.
      description: |
        Returns the findings of the most recent succeeded scan of every
        non-archived asset (failed, canceled and running scans are skipped),
        most severe first. `status` is the effective status: any
        `finding_states` decision for the same asset and fingerprint reports the
        finding as `ignored` and fills `state` and `reason`, without rewriting
        the stored row.

        `view=single` (the default) returns one row per finding; `view=grouped`
        folds one row per rule and type across projects. `limit` and `offset`
        page the chosen view, and `total` counts every row the filters match
        before the window is applied.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/FindingsListViewQuery"
        - $ref: "#/components/parameters/AssetIDQuery"
        - $ref: "#/components/parameters/SeverityQuery"
        - $ref: "#/components/parameters/FindingTypeQuery"
        - $ref: "#/components/parameters/FindingStatusQuery"
        - $ref: "#/components/parameters/FindingDeciderQuery"
        - $ref: "#/components/parameters/FindingFixQuery"
        - $ref: "#/components/parameters/FindingDependencyQuery"
        - $ref: "#/components/parameters/FindingHideTestsQuery"
        - $ref: "#/components/parameters/FindingHideMaintenanceQuery"
        - $ref: "#/components/parameters/FindingsSearchQuery"
        - $ref: "#/components/parameters/FindingsLimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/FindingsSortQuery"
        - $ref: "#/components/parameters/SortOrderQuery"
      responses:
        "200":
          description: One page of the latest findings, after the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "400":
          description: |
            A query parameter is not a valid asset id, enum value, limit or
            offset, or `q` is longer than 200 characters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/findings/export:
    get:
      operationId: exportFindings
      summary: Download the latest findings as CSV, XLSX or JSON.
      description: |
        Writes the findings of `GET /api/findings` as one download instead of
        one page: the same filters, the same archived-asset exclusion and the
        same effective status and decision expiry. The full result is written,
        never a page.

        `view=grouped` folds one row per rule and type across projects, like the
        Findings page: the worst severity, the rule, the title, the packages,
        the affected projects and the finding and open counts. `view=single`
        writes one row per finding. EPSS columns are present only while the feed
        is enabled. CSV is RFC 4180 with a UTF-8 BOM; XLSX is one sheet written
        without a dependency; JSON is an array of objects with stable keys.
        Cells that a spreadsheet could evaluate as a formula are prefixed with
        an apostrophe in CSV and XLSX.

        This operation is hand-written in `internal/httpapi/findings_export.go`
        and excluded from codegen (api/oapi-codegen.yaml): the generated strict
        server cannot set the `Content-Disposition` header. Like
        `/api/scans/{id}/sbom`, the spec stays the contract.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/FindingsExportFormatQuery"
        - $ref: "#/components/parameters/FindingsViewQuery"
        - $ref: "#/components/parameters/AssetIDQuery"
        - $ref: "#/components/parameters/SeverityQuery"
        - $ref: "#/components/parameters/FindingTypeQuery"
        - $ref: "#/components/parameters/FindingStatusQuery"
        - $ref: "#/components/parameters/FindingDeciderQuery"
        - $ref: "#/components/parameters/FindingFixQuery"
        - $ref: "#/components/parameters/FindingDependencyQuery"
        - $ref: "#/components/parameters/FindingHideTestsQuery"
        - $ref: "#/components/parameters/FindingHideMaintenanceQuery"
        - $ref: "#/components/parameters/FindingsSearchQuery"
      responses:
        "200":
          description: The findings as one downloadable file.
          headers:
            Content-Disposition:
              description: |
                Attachment with the filename
                `bastion-findings-<view>-<YYYYMMDD>.<ext>`.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "400":
          description: |
            `format` or `view` is not one of the accepted values, `asset_id` is
            not a positive integer, a filter is not a valid enum value, or `q`
            is longer than 200 characters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/licence-policy:
    get:
      operationId: getLicencePolicy
      summary: Read the licence allow/deny policy.
      description: |
        Returns the global policy when `asset_id` is omitted, otherwise that
        asset's policy. A licence without a rule is absent from both lists. The
        lists are normalized to lower case and sorted.
      tags: [licence-policy]
      parameters:
        - $ref: "#/components/parameters/LicencePolicyAssetIDQuery"
      responses:
        "200":
          description: The policy of the requested scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicencePolicy"
        "400":
          description: |
            `asset_id` is not a positive integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: No asset has that id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setLicencePolicy
      summary: Replace the licence allow/deny policy.
      description: |
        Replaces both lists of one scope in a single transaction. Licences are
        trimmed, lower-cased, de-duplicated and sorted; a licence may not be in
        both lists. The response is the stored policy.
      tags: [licence-policy]
      parameters:
        - $ref: "#/components/parameters/LicencePolicyAssetIDQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicencePolicy"
      responses:
        "200":
          description: The policy was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicencePolicy"
        "400":
          description: |
            The body is missing, an entry is empty, longer than 128 printable
            ASCII characters, appears in both lists, or the policy has more
            than 500 entries.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: No asset has that id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/preferences:
    get:
      operationId: getPreferences
      summary: Read the per-install UI preferences.
      description: |
        Returns every stored preference as a flat object of string values. A
        key without a value is absent, which lets the UI tell "the server has
        no copy" from a stored default and migrate the localStorage value up.
      tags: [preferences]
      responses:
        "200":
          description: The stored preferences, keyed by localStorage key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setPreferences
      summary: Merge UI preferences.
      description: |
        Writes only the keys the body carries; every other stored preference is
        left untouched. A key outside the whitelist or a value longer than 64
        characters is a 400. The response is the full stored set after the
        merge.
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: The preferences were merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          description: |
            The body is missing, a key is not whitelisted, or a value is longer
            than 64 characters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/notifications:
    get:
      operationId: getNotificationSettings
      summary: Read the notification settings.
      description: |
        Returns the master switch, the threshold and whether Slack and email
        are enabled, plus whether a webhook or SMTP password is configured. The
        credential values themselves are never returned; they live in the OS
        keyring.
      tags: [notifications]
      responses:
        "200":
          description: The stored notification settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setNotificationSettings
      summary: Store the notification settings.
      description: |
        Writes only the fields the body carries; every other stored setting is
        left untouched. `slack_webhook` sets the webhook (write-only, must be an
        https URL on hooks.slack.com) and `clear_slack_webhook` removes it;
        `email_password` sets the SMTP password (write-only) and
        `clear_email_password` removes it. Sending both a value and its clear
        flag, an invalid threshold, webhook, host, port or address is a 400.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNotificationSettingsRequest"
      responses:
        "200":
          description: The settings were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          description: |
            The body is missing, the threshold is not `high` or `critical`, the
            webhook is not an https URL on hooks.slack.com, an SMTP host, port
            or address is invalid, or a value and its clear flag are sent
            together.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/notifications/test:
    post:
      operationId: sendTestNotification
      summary: Send a test message to every configured notifier.
      description: |
        Sends a sample message through each configured channel (Slack when a
        webhook is stored, email when a host, sender and recipients are set),
        regardless of whether that channel is enabled. With no channel
        configured it answers 400; a channel that rejects the message or cannot
        be reached is a 502. Credentials are never included in the response.
      tags: [notifications]
      responses:
        "204":
          description: Every configured channel accepted the test message.
        "400":
          description: |
            No notification channel is configured, an SMTP username has no
            stored password, or the stored email settings are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          description: A channel rejected the message or could not be reached.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/llm:
    get:
      operationId: getLLMSettings
      summary: Read the local-model settings.
      description: |
        Returns the master switch, the endpoint and the model name. The
        endpoint is loopback-only and there is no credential.
      tags: [llm]
      responses:
        "200":
          description: The stored local-model settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    put:
      operationId: setLLMSettings
      summary: Store the local-model settings.
      description: |
        Writes only the fields the body carries; every other stored setting is
        left untouched. The endpoint must be an http(s) URL whose host is a
        loopback IP literal or `localhost`; a name is never resolved. Any other
        endpoint, a model name that is too long, or a malformed URL is a 422.
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLLMSettingsRequest"
      responses:
        "200":
          description: The settings were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMSettings"
        "400":
          description: |
            The body is missing or malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            The endpoint is not loopback http(s), or the model name is longer
            than 200 characters. Nothing was stored.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/assets/{assetId}/findings/{fingerprint}/explain:
    post:
      operationId: explainFinding
      summary: Explain one finding with the optional local model.
      description: |
        Sends the finding to the configured local OpenAI-compatible endpoint
        (`POST {endpoint}/chat/completions`) and returns the model's answer as
        Markdown. The finding's text is sent as delimited untrusted data and
        the answer is advisory: this endpoint never changes a finding, a scan
        or any other state. It answers 400 when the feature is off or no model
        is configured, 404 when the asset has no such finding, and 502 when
        the local endpoint fails.
      tags: [llm]
      parameters:
        - name: assetId
          in: path
          required: true
          description: The asset the finding belongs to.
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/Fingerprint"
      responses:
        "200":
          description: The model's explanation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplainFindingResponse"
        "400":
          description: |
            The local model is disabled, no model is configured, or the stored
            endpoint is no longer valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The asset or its finding does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          description: The local model endpoint failed or returned no answer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/reports/dashboard:
    get:
      operationId: getDashboard
      summary: Dashboard aggregates across non-archived assets.
      description: |
        Totals, the five riskiest assets, a trend of open critical+high findings
        and the last scan of every asset. Every aggregate counts only open
        findings (no `finding_states` decision) of each asset's most recent
        succeeded scan; archived assets are excluded throughout.

        Ignore decisions are keyed on (asset_id, fingerprint) and are applied to
        all scans of the asset, so ignoring a finding also removes it from older
        points of the trend (retroactive) rather than only from the newest point.
      tags: [reports]
      responses:
        "200":
          description: The dashboard aggregates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/events:
    get:
      operationId: streamEvents
      summary: Stream scan lifecycle events.
      description: |
        Server-Sent Events stream of everything the scan queue does
        (PROJECT_SPEC.md §6). Each frame is `event: <type>` plus one
        `data: <ScanEvent JSON>` line, where the event type is `scan.queued`,
        `scan.progress` or `scan.finished`. An idle stream sends a `: ping`
        comment every 15 seconds; comments are not events.

        There is no replay: the stream continues with the next event after it
        opens, so a client that reconnects refetches the state it missed. A
        client that falls too far behind is dropped, so a slow reader can never
        stall a scan worker. Like every other `/api/*` route the stream
        requires the `bastion_session` cookie; mutating-request CSRF does not
        apply to this GET.
      tags: [scans]
      responses:
        "200":
          description: The event stream, open until the client disconnects.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ScanEvent"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bastion_session
      description: |
        Set by the server when it exchanges the single-use startup token for a
        session. `HttpOnly; SameSite=Strict; Path=/` (no `Secure`, since the
        transport is plain HTTP on loopback). Never sent to or read by the SPA.
  parameters:
    ConnectionID:
      name: id
      in: path
      required: true
      description: Connection id.
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetIDQuery:
      name: asset_id
      in: query
      required: false
      description: Only findings of this asset.
      schema:
        type: integer
        format: int64
        minimum: 1
    LicencePolicyAssetIDQuery:
      name: asset_id
      in: query
      required: false
      description: |
        The asset whose policy is read or replaced. Omit for the global policy.
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetIDRequiredQuery:
      name: asset_id
      in: query
      required: true
      description: The asset the decision belongs to.
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetID:
      name: id
      in: path
      required: true
      description: Asset id.
      schema:
        type: integer
        format: int64
        minimum: 1
    ScanID:
      name: id
      in: path
      required: true
      description: Scan id.
      schema:
        type: integer
        format: int64
        minimum: 1
    ScanLimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of scans to return, newest first.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    FindingsLimitQuery:
      name: limit
      in: query
      required: false
      description: |
        Rows per page. In grouped view a row is one rule and type.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    OffsetQuery:
      name: offset
      in: query
      required: false
      description: Rows to skip before the page.
      schema:
        type: integer
        minimum: 0
        default: 0
    SortOrderQuery:
      name: order
      in: query
      required: false
      description: |
        Direction of `sort`; ignored when no `sort` is given. `asc` when absent.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    FindingsSortQuery:
      name: sort
      in: query
      required: false
      description: |
        Column to order the latest findings by. Omitted keeps the default, most
        severe first. `severity` orders by its rank, not alphabetically. In
        grouped view `project` orders by the number of projects the group
        reaches.
      schema:
        type: string
        enum: [severity, title, package, project, type]
    ScanSortQuery:
      name: sort
      in: query
      required: false
      description: |
        Column to order the scan list by. Omitted keeps the default, newest
        first. `duration` and `findings` read the same values the list shows.
      schema:
        type: string
        enum: [started, status, project, duration, findings]
    FindingsListViewQuery:
      name: view
      in: query
      required: false
      description: |
        `single` returns one row per finding; `grouped` folds one row per rule
        and type across projects.
      schema:
        type: string
        enum: [single, grouped]
        default: single
    Fingerprint:
      name: fingerprint
      in: path
      required: true
      description: Stable finding fingerprint within one asset.
      schema:
        type: string
        minLength: 1
    SeverityQuery:
      name: severity
      in: query
      required: false
      description: Only findings with this severity.
      schema:
        $ref: "#/components/schemas/Severity"
    FindingTypeQuery:
      name: type
      in: query
      required: false
      description: Only findings of this type.
      schema:
        $ref: "#/components/schemas/FindingType"
    FindingStatusQuery:
      name: status
      in: query
      required: false
      description: Only findings with this effective status.
      schema:
        $ref: "#/components/schemas/FindingStatus"
    FindingDeciderQuery:
      name: decided_by
      in: query
      required: false
      description: Only findings whose decision was made by this decider.
      schema:
        $ref: "#/components/schemas/FindingDecider"
    FindingFixQuery:
      name: fix
      in: query
      required: false
      description: Only findings with a known fix, or only those without one.
      schema:
        $ref: "#/components/schemas/FindingFixFilter"
    FindingDependencyQuery:
      name: dependency
      in: query
      required: false
      description: Only findings of direct, or of indirect, dependencies.
      schema:
        $ref: "#/components/schemas/FindingDependencyFilter"
    FindingHideTestsQuery:
      name: hide_tests
      in: query
      required: false
      description: Leave out findings in test, fixture and example paths.
      schema:
        type: boolean
    FindingHideMaintenanceQuery:
      name: hide_maintenance
      in: query
      required: false
      description: Leave out licence and outdated-package findings.
      schema:
        type: boolean
    FindingsSearchQuery:
      name: q
      in: query
      required: false
      description: |
        Case-insensitive substring to search for in the finding title, rule id
        (CVE, GHSA or rule name), package name and file path. Trimmed; an empty
        value applies no filter. `%` and `_` are matched literally.
      schema:
        type: string
        maxLength: 200
    FindingsExportFormatQuery:
      name: format
      in: query
      required: true
      description: The download format.
      schema:
        type: string
        enum: [csv, xlsx, json]
    FindingsViewQuery:
      name: view
      in: query
      required: false
      description: |
        `grouped` (the default) writes one row per rule and type; `single`
        writes one row per finding.
      schema:
        type: string
        enum: [grouped, single]
        default: grouped
  responses:
    Problem:
      description: |
        The request was rejected (RFC 9457 problem details). The same shape is
        used for every non-2xx response.
      headers:
        Content-Type:
          description: Always `application/problem+json`.
          schema:
            type: string
            const: application/problem+json
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      title: Health
      description: Liveness of the local API.
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
          description: Always `ok` while the server is accepting requests.
        version:
          type: string
          description: |
            Build version of the running binary (`dev` for local builds,
            otherwise the release tag).
          examples: ["0.1.0"]
    MCPSetup:
      type: object
      title: MCPSetup
      description: |
        How to start `bastion mcp` for this install: the running binary's real
        path (symlinks resolved) and the arguments that point it at the same
        data directory as `bastion serve`.
      additionalProperties: false
      required: [command, args]
      properties:
        command:
          type: string
          description: Absolute path of the running bastion binary.
        args:
          type: array
          description: Arguments that follow the command to start the MCP server.
          items:
            type: string
          examples:
            - ["mcp", "--data-dir", "/home/me/.config/bastion"]
    UpdateConsent:
      type: string
      title: UpdateConsent
      description: |
        The user's answer to the release-check question. `unset` and `off` both
        mean no network request; only `on` allows the daily check.
      enum: [unset, on, off]
    UpdateStatus:
      type: object
      title: UpdateStatus
      description: |
        The release check as the UI and the CLI see it. Optional fields are
        absent when there is no successful check or no newer release.
      additionalProperties: false
      required: [current, update_available, consent, disabled]
      properties:
        current:
          type: string
          description: Version of the running binary (`dev` for local builds).
        disabled:
          type: boolean
          description: |
            True when no check can run whatever the consent says
            (`BASTION_NO_UPDATE_CHECK`, a CI environment or a `dev` build). The
            UI then does not ask.
        latest:
          type: string
          description: |
            Newest release tag from the cached check. Absent before the first
            successful check.
        update_available:
          type: boolean
          description: True when `latest` is a newer semver than `current`.
        consent:
          $ref: "#/components/schemas/UpdateConsent"
        command:
          type: string
          description: |
            Command that updates this installation (Homebrew or the install.sh
            one-liner). Absent on Windows and when no update is available.
        release_url:
          type: string
          format: uri
          description: Release-notes page for `latest`; absent when no update is available.
    SetUpdateConsentRequest:
      type: object
      title: SetUpdateConsentRequest
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: True turns the daily release check on; false turns it off.
    EPSSScore:
      type: object
      title: EPSSScore
      description: |
        FIRST.org's EPSS prediction for one CVE: the probability that it is
        exploited in the next 30 days, and the score's percentile among all
        scored CVEs. Both are fractions between 0 and 1.
      additionalProperties: false
      required: [score, percentile]
      properties:
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          examples: [0.99999]
        percentile:
          type: number
          format: double
          minimum: 0
          maximum: 1
          examples: [1.0]
    EPSSStatus:
      type: object
      title: EPSSStatus
      description: |
        The EPSS feed as the UI and the CLI see it. Optional fields are absent
        when the feed has not been downloaded or the last download failed.
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            The stored opt-in setting. False means no request is ever made and
            findings carry no EPSS score.
        last_refresh:
          type: string
          format: date-time
          description: When the cached feed was last downloaded.
        score_date:
          type: string
          description: |
            The feed's own score date, from its header. Later than
            `last_refresh` when the published scores did not change.
          examples: ["2026-11-15T12:03:04Z"]
        count:
          type: integer
          minimum: 0
          description: Number of CVEs the cached feed scores.
        error:
          type: string
          description: |
            Why the last download failed. The previous cache, if any, stays in
            use, so findings keep their scores.
    SetEPSSEnabledRequest:
      type: object
      title: SetEPSSEnabledRequest
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            True opts in to the daily FIRST.org download; false turns it off and
            stops every future request.
    FindingFixFilter:
      type: string
      title: FindingFixFilter
      enum: [available, none]
    FindingDependencyFilter:
      type: string
      title: FindingDependencyFilter
      enum: [direct, indirect]
    FindingDecider:
      type: string
      title: FindingDecider
      description: Who made a finding decision, the user or an agent over MCP.
      enum: [user, agent]
    OutdatedStatus:
      type: object
      title: OutdatedStatus
      description: |
        The opt-in outdated-package lookup as the UI and the CLI see it. The
        setting is off by default; with it off no request reaches deps.dev and
        findings carry no latest version.
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            The stored opt-in setting. False means no request is ever made and
            findings carry no latest version.
    SetOutdatedEnabledRequest:
      type: object
      title: SetOutdatedEnabledRequest
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            True opts in to the deps.dev lookup during scans; false turns it off
            and stops every future request.
    EOLStatus:
      type: object
      title: EOLStatus
      description: |
        The opt-in end-of-life lookup. It is off by default; with it off no
        request reaches endoflife.date.
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: The stored opt-in setting.
    SetEOLEnabledRequest:
      type: object
      title: SetEOLEnabledRequest
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            True opts in to the endoflife.date lookup during scans; false stops
            every future request.
    Reachability:
      type: string
      title: Reachability
      description: |
        Whether a Go vulnerability's vulnerable function is called, as
        govulncheck reported it for the scan that produced the finding.
        `reachable` carries a call trace, `unreachable` means the advisory was
        found only at package or module level, and `unknown` means no answer
        (govulncheck did not run, failed, or does not know the advisory).
      enum: [reachable, unreachable, unknown]
    Preferences:
      type: object
      title: Preferences
      description: |
        Per-install UI preferences, keyed by the localStorage key the UI uses.
        The whitelist is fixed (theme, mode, font family, font size, language
        and the two dashboard dismissals); a value is at most 64 characters.
      additionalProperties:
        type: string
        maxLength: 64
    NotificationThreshold:
      type: string
      title: NotificationThreshold
      description: |
        The lowest severity that makes a new finding notify. `high` counts
        critical and high findings; `critical` counts only critical ones.
      enum: [high, critical]
    NotificationSettings:
      type: object
      title: NotificationSettings
      description: |
        The stored notification choices. The Slack webhook and the SMTP
        password are absent by design: the API reports only whether each is
        configured.
      additionalProperties: false
      required:
        [enabled, threshold, slack_enabled, slack_configured, email_enabled,
         smtp_host, smtp_port, smtp_username, from, to,
         email_password_configured]
      properties:
        enabled:
          type: boolean
          description: |
            The master switch. With it off no notifier is called after a scan.
        threshold:
          $ref: "#/components/schemas/NotificationThreshold"
        slack_enabled:
          type: boolean
          description: Whether the Slack notifier is called after a scan.
        slack_configured:
          type: boolean
          description: |
            Whether a Slack webhook is stored in the OS keyring. The URL itself
            is never returned.
        email_enabled:
          type: boolean
          description: Whether the email notifier is called after a scan.
        smtp_host:
          type: string
          description: |
            The SMTP submission host. Empty until configured. STARTTLS is
            required; port 465 implicit TLS is not supported.
        smtp_port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: The SMTP submission port. Defaults to 587.
        smtp_username:
          type: string
          description: |
            The optional SMTP AUTH PLAIN username. Empty means no
            authentication is attempted.
        from:
          type: string
          description: The validated sender address.
        to:
          type: string
          description: |
            One or more validated recipient addresses, comma separated.
        email_password_configured:
          type: boolean
          description: |
            Whether an SMTP password is stored in the OS keyring. The password
            itself is never returned.
    SetNotificationSettingsRequest:
      type: object
      title: SetNotificationSettingsRequest
      description: |
        The settable notification fields. Omitted fields are left untouched;
        `slack_webhook` and `email_password` are write-only and
        `clear_slack_webhook` and `clear_email_password` remove the stored
        credential.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        threshold:
          $ref: "#/components/schemas/NotificationThreshold"
        slack_enabled:
          type: boolean
        slack_webhook:
          type: string
          writeOnly: true
          maxLength: 512
          description: |
            An https incoming-webhook URL on hooks.slack.com. Stored in the OS
            keyring, never in SQLite and never returned.
        clear_slack_webhook:
          type: boolean
          description: |
            Removes the stored webhook. Cannot be combined with
            `slack_webhook`.
        email_enabled:
          type: boolean
        smtp_host:
          type: string
          maxLength: 255
          description: |
            A hostname or IP literal. A URL or a value with whitespace is
            refused.
        smtp_port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: The SMTP submission port, for example 587.
        smtp_username:
          type: string
          maxLength: 512
          description: The optional SMTP AUTH PLAIN username.
        from:
          type: string
          maxLength: 320
          description: The sender address, validated with net/mail.
        to:
          type: string
          maxLength: 2000
          description: |
            One or more recipient addresses, comma separated, each validated
            with net/mail.
        email_password:
          type: string
          writeOnly: true
          maxLength: 512
          description: |
            The SMTP password. Stored in the OS keyring, never in SQLite and
            never returned.
        clear_email_password:
          type: boolean
          description: |
            Removes the stored SMTP password. Cannot be combined with
            `email_password`.
    LLMSettings:
      type: object
      title: LLMSettings
      description: |
        The stored local-model choices (ADR-003, #48). The endpoint is an
        OpenAI-compatible base URL on the loopback interface; there is no
        credential.
      additionalProperties: false
      required: [enabled, endpoint, model]
      properties:
        enabled:
          type: boolean
          description: |
            The master switch. With it off no request reaches a model server
            and the finding drawer shows no Explain action.
        endpoint:
          type: string
          maxLength: 2048
          description: |
            The base URL, for example `http://127.0.0.1:11434/v1` (Ollama).
            Only http(s) on a loopback IP literal or `localhost` is accepted;
            a name is never resolved.
        model:
          type: string
          maxLength: 200
          description: |
            The model name the server expects, for example `llama3.1`. Empty
            until the user chooses one; an explanation requires it.
    SetLLMSettingsRequest:
      type: object
      title: SetLLMSettingsRequest
      description: |
        The settable local-model fields. Omitted fields are left untouched.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        endpoint:
          type: string
          maxLength: 2048
          description: |
            An http(s) base URL on a loopback IP literal or `localhost`. Any
            other host, a non-http scheme, embedded credentials, a query or a
            fragment is refused.
        model:
          type: string
          maxLength: 200
          description: The model name, for example `llama3.1`.
    ExplainFindingResponse:
      type: object
      title: ExplainFindingResponse
      description: |
        The local model's explanation, as Markdown. It is advisory only: no
        state was changed to produce it. `model` labels the answer even if the
        setting changes while the drawer is open.
      additionalProperties: false
      required: [text, model]
      properties:
        text:
          type: string
          description: The explanation, capped at 8 KiB.
        model:
          type: string
          description: The model that produced the answer.
    LicencePolicyAction:
      type: string
      title: LicencePolicyAction
      description: |
        The effective rule that matched a licence finding (#39). `allow`
        findings are hidden, so only `deny` is normally visible: the finding
        stays in the list with a severity of at least `high`. Absent when no
        rule applies.
      enum: [allow, deny]
    LicencePolicy:
      type: object
      title: LicencePolicy
      description: |
        One scope's licence rules. The lists are normalized to lower case and
        sorted, hold at most 500 entries together, and a licence may not appear
        in both. Matching is exact on the whole licence string as reported, so
        `MIT OR Apache-2.0` is a separate entry from `MIT`.
      additionalProperties: false
      required: [allow, deny]
      properties:
        allow:
          type: array
          description: Licence ids whose findings are hidden.
          items:
            type: string
            minLength: 1
            maxLength: 128
          maxItems: 500
        deny:
          type: array
          description: |
            Licence ids whose findings stay visible with a severity of at least
            `high`.
          items:
            type: string
            minLength: 1
            maxLength: 128
          maxItems: 500
    ReachabilityStatus:
      type: object
      title: ReachabilityStatus
      description: |
        The Go reachability enrichment as the UI and the CLI see it. The
        setting is opt-in and off by default; govulncheck also needs a Go
        toolchain and network access to the vulnerability database.
      additionalProperties: false
      required: [enabled, available]
      properties:
        enabled:
          type: boolean
          description: |
            The stored opt-in setting. False means no govulncheck process runs
            and findings carry no reachability.
        available:
          type: boolean
          description: |
            Whether a `go` executable was found on PATH. False with `enabled`
            true means scans still succeed, but Go findings are `unknown` and
            `bastion doctor` suggests installing Go.
        error:
          type: string
          description: Why the toolchain probe failed, when it did.
    SetReachabilityEnabledRequest:
      type: object
      title: SetReachabilityEnabledRequest
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            True runs govulncheck on future scans of Go modules; false turns the
            enrichment off and stops every future run.
    SASTState:
      type: string
      title: SASTState
      description: |
        State of the downloaded Opengrep module. `not_installed` is normal
        before the first download; `checksum_bad` means the file on disk does
        not match the pinned digest and will not run.
      enum: [not_installed, installed, checksum_bad]
    SASTStatus:
      type: object
      title: SASTStatus
      description: |
        The opt-in SAST module as the UI and the CLI see it. The download is
        pinned to Opengrep v1.33.1 plus its community rule set and happens only
        after `enabled` is true.
      additionalProperties: false
      required: [enabled, state, version, installing]
      properties:
        enabled:
          type: boolean
          description: |
            The stored opt-in setting. False means no download happens and
            repository scans carry no `sast` findings.
        state:
          $ref: "#/components/schemas/SASTState"
        version:
          type: string
          description: The pinned Opengrep release.
          examples: ["v1.33.1"]
        installing:
          type: boolean
          description: True while a download is running.
        error:
          type: string
          description: Why the installed module cannot be used, when it cannot.
        install_error:
          type: string
          description: |
            Why the last download failed. It clears when a later download
            succeeds.
    SetSASTEnabledRequest:
      type: object
      title: SetSASTEnabledRequest
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            True downloads the pinned module once and runs SAST on future
            repository scans; false turns it off without canceling a running
            download.
    TrivyDBState:
      type: string
      title: TrivyDBState
      description: |
        State of the Trivy vulnerability DB. `missing` and `failed` both mean a
        scan downloads it first; only `ready` means scans run straight away.
      enum: [missing, downloading, ready, failed]
    TrivyDBStatus:
      type: object
      title: TrivyDBStatus
      description: |
        The vulnerability DB as the UI and the CLI see it. Optional fields are
        absent when they do not apply to the state.
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/TrivyDBState"
        updated_at:
          type: string
          format: date-time
          description: |
            When the DB was built, from Trivy's metadata. Absent unless the
            state is `ready` and the metadata carries it.
        error:
          type: string
          description: Why the last download failed; present only when `failed`.
        trigger:
          type: string
          description: |
            What started the download in flight, or the last one. Absent before
            the first download.
          enum: [user, scan]
    ConnectionList:
      type: object
      title: ConnectionList
      description: Every configured connection.
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
    Connection:
      type: object
      title: Connection
      description: |
        A configured integration. A credential is never part of this shape: a
        GitHub token lives in the OS keyring under `secret_ref`, and an AWS
        connection keeps no credential at all. Neither the token nor the keyring
        key is returned by the API.
      additionalProperties: false
      required: [id, kind, name, status, created_at, ecr_asset_count]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: "#/components/schemas/ConnectionKind"
        name:
          type: string
          description: User-chosen name, unique per kind.
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        login:
          type: string
          description: |
            GitHub login recorded by the last successful test. GitHub
            connections only; absent until a test succeeds.
        profile:
          type: string
          description: |
            AWS shared-config profile the connection resolves credentials from.
            AWS connections only.
        region:
          type: string
          description: AWS region recorded on the connection. AWS connections only.
        account:
          type: string
          description: |
            AWS account id recorded by the last successful test. AWS
            connections only; absent until a test succeeds.
        arn:
          type: string
          description: |
            ARN of the calling identity recorded by the last successful test.
            AWS connections only; absent until a test succeeds.
        ecr_asset_count:
          type: integer
          format: int64
          minimum: 0
          description: |
            Non-archived ECR image assets this connection owns. Removing the
            connection archives them, so their findings leave the open lists.
            Always 0 for a GitHub connection.
        hint:
          type: string
          description: |
            Human-readable explanation of the last failed test (never a token
            or a GitHub response body). Absent after a successful test.
        last_checked_at:
          type: string
          format: date-time
          description: When the connection was last tested.
        created_at:
          type: string
          format: date-time
    ConnectionKind:
      type: string
      title: ConnectionKind
      description: |
        Integration kind. Only `github` and `aws` can be created; `docker`
        exists because the database and later phases use it.
      enum: [github, aws, docker]
    ConnectionStatus:
      type: string
      title: ConnectionStatus
      description: Result of the last test.
      enum: [ok, error, unknown]
    CreateConnectionRequest:
      type: object
      title: CreateConnectionRequest
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          description: Kind to create. `github` needs `token`; `aws` needs `region`.
          enum: [github, aws]
        name:
          type: string
          minLength: 1
          description: User-chosen name, unique per kind.
        token:
          type: string
          writeOnly: true
          minLength: 1
          description: |
            GitHub personal access token (classic or fine-grained, read-only).
            Stored in the OS keyring, never persisted in SQLite, logged or
            returned by the API. GitHub connections only.
        profile:
          type: string
          maxLength: 64
          pattern: '^([A-Za-z0-9._-]{1,64})?$'
          description: |
            AWS shared-config profile name, for example `work`. Empty means the
            SDK's own resolution (`AWS_PROFILE`, then `default`). AWS
            connections only; no credential is stored.
        region:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-z]{2}(-[a-z0-9]+)+-[0-9]$'
          description: |
            AWS region, for example `eu-central-1`. Required for AWS
            connections.
    RenameConnectionRequest:
      type: object
      title: RenameConnectionRequest
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: New user-chosen name, unique per kind.
    DiscoverReposResponse:
      type: object
      title: DiscoverReposResponse
      additionalProperties: false
      required: [repos]
      properties:
        repos:
          type: array
          description: GitHub repositories; empty for an AWS connection.
          items:
            $ref: "#/components/schemas/DiscoveredRepo"
        ecr_repositories:
          type: array
          description: ECR repositories; empty for a GitHub connection.
          items:
            $ref: "#/components/schemas/EcrRepository"
    EcrRepository:
      type: object
      title: EcrRepository
      description: One ECR repository with its newest tags.
      additionalProperties: false
      required: [name, uri, tags]
      properties:
        name:
          type: string
          examples: ["t2n-api"]
        uri:
          type: string
          description: Registry-qualified repository URI.
          examples: ["143709573002.dkr.ecr.eu-central-1.amazonaws.com/t2n-api"]
        tags:
          type: array
          description: Up to 10 newest tags, newest first.
          items:
            $ref: "#/components/schemas/EcrTag"
    EcrTag:
      type: object
      title: EcrTag
      description: |
        One ECR image digest and the tags that point at it. Tags sharing a
        digest are grouped, newest first.
      additionalProperties: false
      required: [tags, digest, ref, pushed_at, already_added]
      properties:
        tags:
          type: array
          minItems: 1
          description: Every tag that points at this digest, newest first.
          items:
            type: string
          examples: [["latest", "a5c55d6"]]
        digest:
          type: string
          description: Image manifest digest.
          examples: ["sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
        ref:
          type: string
          description: Digest-pinned reference to create the asset with.
          examples: ["143709573002.dkr.ecr.eu-central-1.amazonaws.com/t2n-api@sha256:aaaa"]
        pushed_at:
          type: string
          format: date-time
        already_added:
          type: boolean
          description: True when an asset with this digest-pinned ref exists.
    DiscoveredRepo:
      type: object
      title: DiscoveredRepo
      description: A repository the connection can add as an asset.
      additionalProperties: false
      required: [full_name, default_branch, private, archived, already_added]
      properties:
        full_name:
          type: string
          description: Canonical `owner/repo` reference.
          examples: ["octo/hello"]
        default_branch:
          type: string
          examples: ["main"]
        private:
          type: boolean
        archived:
          type: boolean
        already_added:
          type: boolean
          description: |
            True when an asset with this `owner/repo` reference already exists,
            whichever connection (or the CLI) added it.
    Severity:
      type: string
      title: Severity
      description: Normalized severity scale (`unknown` when a scanner gave no usable level).
      enum: [critical, high, medium, low, unknown]
    FindingType:
      type: string
      title: FindingType
      description: Kind of finding (PROJECT_SPEC.md §5).
      enum: [vulnerability, secret, outdated, misconfig, license, malware, sast]
    FindingStatus:
      type: string
      title: FindingStatus
      description: |
        Effective status. Any `finding_states` decision for the same asset and
        fingerprint reports the finding as `ignored`; the decision itself is in
        `state`.
      enum: [open, ignored]
    FindingState:
      type: string
      title: FindingState
      description: The user decision that hides a finding across scans.
      enum: [ignored, accepted_risk, false_positive]
    AssetKind:
      type: string
      title: AssetKind
      description: What the asset is.
      enum: [repo, image, path]
    ScanStatus:
      type: string
      title: ScanStatus
      description: Lifecycle state of a scan.
      enum: [queued, running, succeeded, failed, canceled]
    Finding:
      type: object
      title: Finding
      description: |
        One normalized finding of an asset's latest succeeded scan. Optional
        fields are absent when the scanner did not provide them.
      additionalProperties: false
      required:
        [id, asset_id, scan_id, fingerprint, type, severity, title, occurrences, scanner, scanners, status, references]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        asset_id:
          type: integer
          format: int64
          minimum: 1
        scan_id:
          type: integer
          format: int64
          minimum: 1
        fingerprint:
          type: string
          description: |
            Stable identifier of the finding across scans (PROJECT_SPEC.md §5).
        type:
          $ref: "#/components/schemas/FindingType"
        severity:
          $ref: "#/components/schemas/Severity"
        title:
          type: string
        rule_id:
          type: string
          description: CVE, GHSA or scanner rule id.
        package_name:
          type: string
        package_version:
          type: string
        fixed_version:
          type: string
          description: Version that closes the finding, when the advisory knows one.
        ecosystem:
          type: string
          examples: ["npm", "go", "deb"]
        location:
          type: string
          description: |
            Display location: `file:line` (line is display only), file plus
            cause for misconfigurations, or the package path inside an image.
        occurrences:
          type: integer
          minimum: 1
          description: Raw occurrences merged into this finding within one scan.
        scanner:
          type: string
          description: |
            Primary scanner. Its fingerprint is the one stored, so it stays
            stable when another scanner reports the same advisory.
        scanners:
          type: array
          description: |
            Every scanner that reported the finding. A CVE reported by both
            Trivy and OSV appears once with both entries; `scanner` is the
            primary one.
          items:
            type: string
        status:
          $ref: "#/components/schemas/FindingStatus"
        state:
          $ref: "#/components/schemas/FindingState"
        reason:
          type: string
          description: The reason recorded with the decision in `state`.
        decided_by:
          $ref: "#/components/schemas/FindingDecider"
        expires_at:
          type: string
          description: |
            When the decision stops applying, in UTC (`YYYY-MM-DDTHH:MM:SS.sssZ`).
            Absent when the decision has no expiry.
        expired:
          type: boolean
          description: |
            True when a decision exists but its expiry has passed: the finding
            counts as open again, while `state` keeps the expired decision so
            the drawer can show and replace it. Absent otherwise.
        first_seen_scan_id:
          type: integer
          format: int64
          description: Scan that reported this fingerprint for the asset first.
        description:
          type: string
        references:
          type: array
          description: Advisory or rule references; `[]` when there are none.
          items:
            type: string
        epss:
          $ref: "#/components/schemas/EPSSScore"
        reachability:
          $ref: "#/components/schemas/Reachability"
        licence_policy:
          $ref: "#/components/schemas/LicencePolicyAction"
    FindingList:
      type: object
      title: FindingList
      description: |
        One page of a findings list. `view=single` fills `findings` and leaves
        `groups` empty; `view=grouped` fills `groups` and leaves `findings`
        empty. `total` counts the rows the filters match in the chosen view
        (findings, or groups) before the window; `total_findings` always counts
        the matching findings, which in grouped view is the sum over every
        group, not just this page. `limit` is `0` on endpoints without a page
        size, such as the findings of one scan.
      additionalProperties: false
      required: [findings, groups, total, total_findings, limit, offset]
      properties:
        findings:
          type: array
          description: This page's findings, most severe first. Empty in grouped view.
          items:
            $ref: "#/components/schemas/Finding"
        groups:
          type: array
          description: |
            One row per rule and type, worst first. Empty in single view.
          items:
            $ref: "#/components/schemas/FindingGroup"
        total:
          type: integer
          description: |
            Rows the filters match: findings in single view, groups in grouped
            view.
        total_findings:
          type: integer
          description: Findings the filters match, across every group in grouped view.
        limit:
          type: integer
          description: The page size the request asked for; `0` when there is none.
        offset:
          type: integer
          description: How many rows the request skipped.
    FindingGroup:
      type: object
      title: FindingGroup
      description: |
        One rule (or, without a rule id, one fingerprint) and type, folded
        across projects (#90). Members keep the single list's order, and groups
        sort by worst severity, then finding count, then title.
      additionalProperties: false
      required: [key, title, type, severity, asset_ids, project_count, packages, fixed_versions, findings]
      properties:
        key:
          type: string
          description: |
            Stable key of the group (rule id or fingerprint, then type); the UI
            uses it for selection and React keys.
        rule_id:
          type: string
          description: Absent when the scanner reported no rule id.
        title:
          type: string
        type:
          $ref: "#/components/schemas/FindingType"
        severity:
          $ref: "#/components/schemas/Severity"
        asset_ids:
          type: array
          description: Affected assets, first-seen order.
          items:
            type: integer
            format: int64
            minimum: 1
        project_count:
          type: integer
        packages:
          type: array
          description: Distinct package names, first-seen order.
          items:
            type: string
        fixed_versions:
          type: array
          description: Distinct fixed versions, first-seen order.
          items:
            type: string
        fixed_version:
          type: string
          description: |
            The fixed version when every member agrees on one; absent otherwise.
        findings:
          type: array
          description: Every member finding, in the single list's order.
          items:
            $ref: "#/components/schemas/Finding"
    FixPlan:
      type: object
      title: FixPlan
      description: |
        One asset's open vulnerability findings grouped into package upgrades
        (PROJECT_SPEC.md §7.2, §8 Phase 3).
      additionalProperties: false
      required: [steps, no_fix]
      properties:
        steps:
          type: array
          description: One package upgrade each, highest prioritization score first.
          items:
            $ref: "#/components/schemas/FixPlanStep"
        no_fix:
          type: array
          description: Packages whose open findings no upgrade closes.
          items:
            $ref: "#/components/schemas/FixPlanNoFix"
    FixPlanStep:
      type: object
      title: FixPlanStep
      description: |
        One package upgrade that closes every finding in `finding_ids`. The
        target is the highest of the findings' minimal fixed versions.
      additionalProperties: false
      required:
        [ecosystem, package, installed_versions, target_version, approximate, finding_count, severity_counts, finding_ids, score, factors]
      properties:
        ecosystem:
          type: string
          examples: ["npm", "os-deb"]
        package:
          type: string
          examples: ["lodash"]
        installed_versions:
          type: array
          description: |
            Every installed version the step's findings report, in the
            ecosystem's version order. Empty when the scanner reported none.
          items:
            type: string
        target_version:
          type: string
          description: The version that closes every finding of the step.
        approximate:
          type: boolean
          description: |
            True when the target came from the generic version fallback rather
            than the ecosystem's own comparison rules.
        finding_count:
          type: integer
          minimum: 1
        severity_counts:
          $ref: "#/components/schemas/SeverityTotals"
        finding_ids:
          type: array
          description: The step's findings, by id, in ascending order.
          items:
            type: integer
            format: int64
            minimum: 1
        pull_request:
          $ref: "#/components/schemas/FixPlanPullRequest"
        max_epss:
          $ref: "#/components/schemas/EPSSScore"
        score:
          type: number
          format: double
          description: |
            Prioritization score (#29): the step's severity weight sum
            (critical 10, high 7, medium 4, low and unknown 1) times its EPSS
            and latest-image multipliers. Steps are ordered by it, highest
            first.
        factors:
          type: array
          description: |
            The terms that produced `score`, in computation order: the severity
            weight sum followed by the multipliers. Shown next to the score so
            the ordering is explainable.
          items:
            $ref: "#/components/schemas/FixPlanFactor"
    FixPlanPullRequest:
      type: object
      title: FixPlanPullRequest
      description: |
        The pull request bastion opened for one fix plan step (#47). Present
        only when one was recorded, so the UI shows its state instead of
        offering the same bump again. `merged` means the change landed and the
        next scan confirms it.
      additionalProperties: false
      required: [number, url, state]
      properties:
        number:
          type: integer
          minimum: 1
          description: The repository's pull request number.
        url:
          type: string
          format: uri
          description: The pull request's web URL.
        state:
          type: string
          enum: [open, merged]
          description: |
            `open` while GitHub reports the pull request open; `merged` once it
            landed. A pull request closed without merging is not reported: its
            record is deleted and the step offers the action again.
    FixPlanFactor:
      type: object
      title: FixPlanFactor
      description: One term of a fix plan step's prioritization score.
      additionalProperties: false
      required: [name, value, detail]
      properties:
        name:
          type: string
          description: |
            `severity` is the weight sum; `epss`, `latest_image` and
            `reachability` are multipliers, 1 when the factor does not apply.
          enum: [severity, epss, latest_image, reachability]
          # Explicit Go names: the default "severity" would generate a
          # Severity constant and clash with the Severity type.
          x-enum-varnames: [FixPlanFactorSeverity, FixPlanFactorEPSS, FixPlanFactorLatestImage, FixPlanFactorReachability]
        value:
          type: number
          format: double
          description: "The term's value: a weight sum for severity, a multiplier otherwise."
          examples: [17, 4.2, 1.5]
        detail:
          type: string
          description: Why the term has this value, in words the UI can show.
          examples: ["1 critical + 2 high", "EPSS 0.42", "in latest image", "reachable"]
    FixPlanNoFix:
      type: object
      title: FixPlanNoFix
      description: A package whose open findings no upgrade closes.
      additionalProperties: false
      required: [ecosystem, package, finding_count, severity_counts, finding_ids]
      properties:
        ecosystem:
          type: string
          examples: ["npm", "os-deb"]
        package:
          type: string
          examples: ["openssl"]
        finding_count:
          type: integer
          minimum: 1
        severity_counts:
          $ref: "#/components/schemas/SeverityTotals"
        finding_ids:
          type: array
          description: The package's findings, by id, in ascending order.
          items:
            type: integer
            format: int64
            minimum: 1
    FixPlanPullRequestRequest:
      type: object
      title: FixPlanPullRequestRequest
      description: |
        One confirmed fix plan step to open a pull request for (#47). The three
        identifiers must match a step of the asset's current plan; `confirm`
        is the user's explicit go-ahead.
      additionalProperties: false
      required: [ecosystem, package, target, confirm]
      properties:
        ecosystem:
          type: string
          description: |
            The step's ecosystem. Only `go` (`go.mod`) and `npm`
            (`package.json`) manifests are supported in this version.
          enum: [go, npm]
        package:
          type: string
          minLength: 1
          examples: ["lodash"]
        target:
          type: string
          minLength: 1
          description: The step's exact target version.
          examples: ["4.17.21"]
        confirm:
          type: boolean
          description: |
            Must be `true`. A false or absent value is refused with `400`, so no
            branch or pull request is created without an explicit confirmation.
    FixPlanPullRequestResult:
      type: object
      title: FixPlanPullRequestResult
      description: The pull request opened for one fix plan step.
      additionalProperties: false
      required: [url, number, branch, manifest]
      properties:
        url:
          type: string
          format: uri
          description: The pull request's web URL.
        number:
          type: integer
          minimum: 1
          description: The repository's pull request number.
        branch:
          type: string
          description: The head branch bastion created, `bastion/bump-…`.
        manifest:
          type: string
          description: |
            The repository-relative manifest the pull request changed, such as
            `package.json` or `services/api/go.mod`.
    Dashboard:
      type: object
      title: Dashboard
      description: |
        Aggregates for §7.1. Every number counts open findings of each
        non-archived asset's latest succeeded scan.
      additionalProperties: false
      required: [totals_by_severity, totals_by_type, top_assets, trend, last_scans]
      properties:
        totals_by_severity:
          $ref: "#/components/schemas/SeverityTotals"
        totals_by_type:
          $ref: "#/components/schemas/TypeTotals"
        top_assets:
          type: array
          description: Up to five assets, riskiest first.
          items:
            $ref: "#/components/schemas/AssetRisk"
        trend:
          type: array
          description: |
            Per asset, the open critical+high count of its last ten succeeded
            scans, oldest first. Ignore decisions apply to every point.
          items:
            $ref: "#/components/schemas/AssetTrend"
        last_scans:
          type: array
          description: |
            The newest scan of every non-archived asset that has one, whatever
            its status (a failed last scan is shown as failed).
          items:
            $ref: "#/components/schemas/LastScan"
    SeverityTotals:
      type: object
      title: SeverityTotals
      description: Findings per severity; severities without findings are zero.
      additionalProperties: false
      required: [critical, high, medium, low, unknown]
      properties:
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        medium:
          type: integer
          minimum: 0
        low:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
    ScanDiff:
      type: object
      title: ScanDiff
      description: |
        Change in findings between two scans of the same asset, matched by
        fingerprint. `new` and `persisting` come from `scan_id`; `fixed` comes
        from `against_scan_id`. Without a scan to compare against,
        `against_scan_id` is absent, every finding is `new`, and the other
        groups and counts are empty.
      additionalProperties: false
      required: [scan_id, new, fixed, persisting, counts]
      properties:
        scan_id:
          type: integer
          format: int64
          minimum: 1
        against_scan_id:
          type: integer
          format: int64
          minimum: 1
          description: The scan compared against; absent when there is none.
        new:
          type: array
          description: Findings only in `scan_id`, most severe first.
          items:
            $ref: "#/components/schemas/Finding"
        fixed:
          type: array
          description: Findings only in `against_scan_id`, most severe first.
          items:
            $ref: "#/components/schemas/Finding"
        persisting:
          type: array
          description: |
            Fingerprints in both scans, taken from `scan_id`, most severe first.
          items:
            $ref: "#/components/schemas/Finding"
        counts:
          $ref: "#/components/schemas/ScanDiffCounts"
    ScanDiffCounts:
      type: object
      title: ScanDiffCounts
      description: |
        Findings per severity in each diff group; an empty group is all zeros.
      additionalProperties: false
      required: [new, fixed, persisting]
      properties:
        new:
          $ref: "#/components/schemas/SeverityTotals"
        fixed:
          $ref: "#/components/schemas/SeverityTotals"
        persisting:
          $ref: "#/components/schemas/SeverityTotals"
    TypeTotals:
      type: object
      title: TypeTotals
      description: Open findings per type; types without findings are zero.
      additionalProperties: false
      required: [vulnerability, secret, outdated, misconfig, license, malware, sast]
      properties:
        vulnerability:
          type: integer
          minimum: 0
        secret:
          type: integer
          minimum: 0
        outdated:
          type: integer
          minimum: 0
        misconfig:
          type: integer
          minimum: 0
        license:
          type: integer
          minimum: 0
        malware:
          type: integer
          minimum: 0
        sast:
          type: integer
          minimum: 0
    AssetRisk:
      type: object
      title: AssetRisk
      description: |
        One asset's open findings and risk score
        (`critical*1000 + high*100 + medium*10 + low`). Assets whose open
        findings are all `unknown` severity score 0 and are not listed.
      additionalProperties: false
      required: [asset_id, display_name, kind, score, critical, high, medium, low]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
        kind:
          $ref: "#/components/schemas/AssetKind"
        score:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        medium:
          type: integer
          minimum: 0
        low:
          type: integer
          minimum: 0
    AssetTrend:
      type: object
      title: AssetTrend
      description: One asset's trend series.
      additionalProperties: false
      required: [asset_id, scans]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
        scans:
          type: array
          description: Up to ten succeeded scans, oldest first.
          items:
            $ref: "#/components/schemas/TrendScan"
    TrendScan:
      type: object
      title: TrendScan
      additionalProperties: false
      required: [scan_id, critical_high_open]
      properties:
        scan_id:
          type: integer
          format: int64
          minimum: 1
        finished_at:
          type: string
          format: date-time
          description: Absent only for data written outside a finished scan.
        critical_high_open:
          type: integer
          minimum: 0
    LastScan:
      type: object
      title: LastScan
      additionalProperties: false
      required: [asset_id, display_name, scan_id, status]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
        scan_id:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/ScanStatus"
        finished_at:
          type: string
          format: date-time
          description: Absent while the scan has not finished.
    AssetList:
      type: object
      title: AssetList
      description: Every non-archived asset.
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
    Asset:
      type: object
      title: Asset
      description: One tracked repository, path or image.
      additionalProperties: false
      required: [id, kind, display_name, ref, created_at, scan_schedule, open_counts, linked_images]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: "#/components/schemas/AssetKind"
        connection_id:
          type: integer
          format: int64
          minimum: 1
          description: The connection repo scans authenticate with.
        display_name:
          type: string
        ref:
          type: string
          description: |
            Canonical reference: `owner/repo` for repositories, the absolute
            directory for paths, the image reference for images.
        default_branch:
          type: string
          description: Branch the repository tracks; absent for paths and images.
        ecr_registry:
          type: string
          description: |
            The ECR registry an image was added from, read from its stored
            metadata. Absent for other kinds and for an image added without one.
        created_at:
          type: string
          format: date-time
        scan_schedule:
          $ref: "#/components/schemas/AssetScanSchedule"
        last_scan:
          $ref: "#/components/schemas/AssetLastScan"
        open_counts:
          $ref: "#/components/schemas/SeverityTotals"
        linked_repo:
          $ref: "#/components/schemas/AssetLink"
        linked_images:
          type: array
          description: |
            The images linked to this repository. Empty for paths and images,
            and for a repository nothing was linked to yet.
          items:
            $ref: "#/components/schemas/AssetLink"
    AssetLink:
      type: object
      title: AssetLink
      description: |
        The other end of a repository <-> image link. `source` says who made it:
        `manual` is a user's choice and is never overwritten by a scan, `oci` is
        the image's own org.opencontainers.image.source label.
      additionalProperties: false
      required: [asset_id, ref, display_name, source]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
          description: The id of the linked asset.
        ref:
          type: string
          description: The linked asset's canonical ref.
        display_name:
          type: string
        source:
          $ref: "#/components/schemas/AssetLinkSource"
        revision:
          type: string
          description: |
            The image's org.opencontainers.image.revision label. Absent for a
            manual link and when the image carried no revision.
    AssetLinkSource:
      type: string
      title: AssetLinkSource
      description: How a repository <-> image link was made.
      enum: [manual, oci]
    SetAssetLinkRequest:
      type: object
      title: SetAssetLinkRequest
      description: The repository an image was built from.
      additionalProperties: false
      required: [repo_asset_id]
      properties:
        repo_asset_id:
          type: integer
          format: int64
          minimum: 1

    AssetScanSchedule:
      type: string
      title: AssetScanSchedule
      description: |
        How often bastion scans the asset while `bastion serve` runs: `off`
        (never on a schedule), `daily` (every 24 hours) or `weekly` (every 7
        days). A missed run happens once at the next start.
      enum: [off, daily, weekly]
    SetAssetScheduleRequest:
      type: object
      title: SetAssetScheduleRequest
      description: The asset's scan schedule.
      additionalProperties: false
      required: [schedule]
      properties:
        schedule:
          $ref: "#/components/schemas/AssetScanSchedule"

    AssetLastScan:
      type: object
      title: AssetLastScan
      description: |
        The asset's newest scan, whatever its status: a failed newest scan is
        what the asset list must show.
      additionalProperties: false
      required: [scan_id, status]
      properties:
        scan_id:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/ScanStatus"
        finished_at:
          type: string
          format: date-time
          description: Absent while the scan has not finished.
    DockerImageList:
      type: object
      title: DockerImageList
      description: |
        The local daemon's state and its tagged images. `available` is false
        when no daemon was found.
      additionalProperties: false
      required: [available, host, images]
      properties:
        available:
          type: boolean
        host:
          type: string
          description: |
            The daemon host that answered the probe, for example
            `unix:///var/run/docker.sock`. Empty when no daemon was reached.
        images:
          type: array
          items:
            $ref: "#/components/schemas/DockerImage"
    DockerImage:
      type: object
      title: DockerImage
      description: One tagged image on the local daemon.
      additionalProperties: false
      required: [reference, id, size_bytes, created_at]
      properties:
        reference:
          type: string
          description: "The image tag, for example `nginx:latest`."
        id:
          type: string
          description: The image's content-addressable id.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
    CreateAssetRequest:
      type: object
      title: CreateAssetRequest
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
          description: |
            `repo` takes an `owner/repo` ref; `path` takes an existing absolute
            directory; `image` takes an image reference the local Docker daemon
            holds, or a digest-pinned ECR reference when `connection_id` names
            an AWS connection.
          enum: [repo, path, image]
        ref:
          type: string
          minLength: 1
          description: "`owner/repo` for repositories, an absolute directory for paths, an image reference for images. An ECR image is `<registry>/<repository>@sha256:<digest>`."
          examples: ["octo/hello", "/Users/me/src/hello", "nginx:latest", "143709573002.dkr.ecr.eu-central-1.amazonaws.com/t2n-api@sha256:aaaa"]
        tag:
          type: string
          maxLength: 128
          description: |
            ECR image only: the tag the digest came from. The asset's display
            name is `<repository>:<tag>`. Absent for a local Docker image.
          examples: ["latest"]
        connection_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            Connection whose token resolves the default branch and authenticates
            scans. For an `image` it must be an `aws` connection, which makes
            the image an ECR image. Absent uses the default GitHub token or,
            for an image, the local Docker daemon.
    ScanList:
      type: object
      title: ScanList
      description: One page of scans, newest first, with the total count.
      additionalProperties: false
      required: [scans, total, limit, offset]
      properties:
        scans:
          type: array
          items:
            $ref: "#/components/schemas/Scan"
        total:
          type: integer
          description: Scans the filters match, before the window.
        limit:
          type: integer
          description: The page size the request asked for.
        offset:
          type: integer
          description: How many scans the request skipped.
    Scan:
      type: object
      title: Scan
      description: |
        One scan of one asset. `counts` are every finding this scan recorded,
        per severity; decisions on the asset do not rewrite history, and a scan
        that recorded nothing is all zeros. `scanner_runs` is filled by the
        single-scan read only; the list omits it.
      additionalProperties: false
      required: [id, asset_id, status, trigger, counts]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        asset_id:
          type: integer
          format: int64
          minimum: 1
        target_ref:
          type: string
          description: Resolved git SHA or image digest at scan time, when known.
        status:
          $ref: "#/components/schemas/ScanStatus"
        trigger:
          type: string
          description: Who started the scan.
          enum: [ui, cli, api]
        started_at:
          type: string
          format: date-time
          description: Absent while the scan is still queued.
        finished_at:
          type: string
          format: date-time
          description: Absent while the scan has not finished.
        error:
          type: string
          description: Why a failed scan failed; absent otherwise.
        counts:
          $ref: "#/components/schemas/SeverityTotals"
        scanner_runs:
          type: array
          description: One entry per scanner, in execution order (single-scan read only).
          items:
            $ref: "#/components/schemas/ScannerRun"
    ScannerRun:
      type: object
      title: ScannerRun
      description: One scanner's result inside a scan.
      additionalProperties: false
      required: [scanner, status]
      properties:
        scanner:
          type: string
        scanner_version:
          type: string
        db_version:
          type: string
          description: Version of the advisory database the scanner used.
        status:
          $ref: "#/components/schemas/ScanStatus"
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
          description: Why this scanner failed; absent otherwise.
        warning:
          type: string
          description: |
            Partial-coverage note from a scanner that still succeeded, such as
            output cut off by a timeout or results outside the workspace.
            Absent when the scanner covered everything.
    CreateScansRequest:
      type: object
      title: CreateScansRequest
      additionalProperties: false
      required: [asset_ids]
      properties:
        asset_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
    ScanQueueResult:
      type: object
      title: ScanQueueResult
      additionalProperties: false
      required: [scans]
      properties:
        scans:
          type: array
          items:
            $ref: "#/components/schemas/QueuedScan"
    QueuedScan:
      type: object
      title: QueuedScan
      description: The scan id the caller tracks the queued scan by.
      additionalProperties: false
      required: [scan_id, asset_id]
      properties:
        scan_id:
          type: integer
          format: int64
          minimum: 1
        asset_id:
          type: integer
          format: int64
          minimum: 1
    BulkSetFindingStateRequest:
      type: object
      title: BulkSetFindingStateRequest
      additionalProperties: false
      required: [asset_id, fingerprints, state, reason]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
          description: The asset every fingerprint belongs to; decisions are per asset.
        fingerprints:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: string
            minLength: 1
          description: |
            Findings of the asset to decide on. One unknown fingerprint
            rejects the whole batch.
        state:
          $ref: "#/components/schemas/FindingState"
        reason:
          type: string
          minLength: 1
          description: Why the findings are hidden; shared by the whole batch.
        expires_at:
          type: string
          description: |
            Optional end of the decision: an RFC 3339 timestamp, or a
            `YYYY-MM-DD` date that means the end of that day (UTC). It must be
            in the future, and the findings count as open again once it passes.
    SetFindingStateRequest:
      type: object
      title: SetFindingStateRequest
      additionalProperties: false
      required: [asset_id, state, reason]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
          description: The asset the finding belongs to; decisions are per asset.
        state:
          $ref: "#/components/schemas/FindingState"
        reason:
          type: string
          minLength: 1
          description: Why the finding is hidden; required, so decisions stay reviewable.
        expires_at:
          type: string
          description: |
            Optional end of the decision: an RFC 3339 timestamp, or a
            `YYYY-MM-DD` date that means the end of that day (UTC). It must be
            in the future, and the finding counts as open again once it passes.
    Problem:
      type: object
      title: Problem
      description: |
        RFC 9457 problem details. Extension members are allowed and may be
        added later without a breaking change.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: |
            A URI reference identifying the problem type. `about:blank` means
            the problem carries no more meaning than the HTTP status code.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this specific occurrence.
        fingerprints:
          type: array
          items:
            type: string
          description: |
            Fingerprints a bulk decision named that the asset has no finding
            for. Present only on that 404; nothing was written.
        pr_url:
          type: string
          format: uri
          description: |
            The open pull request that already uses the branch. Present only on
            the fix plan pull request `409`; nothing was written.
    ScanEvent:
      type: object
      title: ScanEvent
      description: |
        One scan lifecycle event, carried in the `data:` line of an
        `/api/events` frame. Optional fields are absent when they do not apply
        to the event type.
      additionalProperties: false
      required: [type, scan_id, asset_id, status]
      properties:
        type:
          type: string
          description: The SSE event name.
          enum: [scan.queued, scan.progress, scan.finished]
        scan_id:
          type: integer
          format: int64
          minimum: 1
        asset_id:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/ScanStatus"
        stage:
          type: string
          description: Pipeline stage of a `scan.progress` event.
          enum: [resolve, fetch, scan, normalize, wait_db]
        scanner:
          type: string
          description: Scanner a `scan.progress` event belongs to, when any.
        error:
          type: string
          description: Why the scan failed, on a failed `scan.finished` event.
