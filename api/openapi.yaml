openapi: 3.1.0
info:
  title: Bastion API
  version: 0.0.0
  summary: Local-first security center — local HTTP API.
  description: |
    Bastion's HTTP API is served by the `bastion serve` process on
    `127.0.0.1:<port>` only (PROJECT_SPEC.md §4.3). There is no remote access,
    no CORS and no API key: every `/api/*` request must carry the
    `bastion_session` cookie that the server issued after exchanging the
    single-use startup token, and mutating requests must also send
    `X-Bastion: 1`.

    Errors are RFC 9457 problem details (`application/problem+json`).

    This file is the authoritative contract (PROJECT_SPEC.md §6, §9): change it
    first, then run `make gen` to regenerate the Go server stubs and the
    TypeScript types.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:{port}
    description: Loopback only. The port is chosen at startup unless `--port` is given.
    variables:
      port:
        default: "0"
        description: Ephemeral port printed by `bastion serve` on start.
tags:
  - name: system
    description: Process and API liveness.
  - name: update
    description: |
      The opt-in release check (ADR-006). Consent, not the database, decides
      whether bastion may contact github.com; `unset` and `off` send nothing.
      `GET /api/update` never blocks on the network.
  - name: trivy-db
    description: |
      The Trivy vulnerability DB a scan needs. `GET /api/trivy-db` never blocks
      on the network; `POST /api/trivy-db/download` starts one download and is
      idempotent while a download is in flight.
  - name: connections
    description: |
      Credentialed integrations used to discover and fetch sources. Tokens live
      in the OS keyring (never in SQLite) and are never returned by the API.
  - name: assets
    description: |
      The repositories and local paths bastion tracks. Archiving is a soft
      delete: history and findings stay readable.
  - name: scans
    description: |
      Scan queue and history. Scans run in the server's worker pool; every scan
      is cancelable until it finishes.
  - name: findings
    description: |
      Normalized findings across assets. The list endpoints report each asset's
      most recent succeeded scan; `status` is the effective status, so a
      finding_states decision shows up as `ignored`.
  - name: reports
    description: |
      Aggregates for the Dashboard (PROJECT_SPEC.md §7.1). Every number counts
      open findings of each non-archived asset's latest succeeded scan.
security:
  - sessionCookie: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness and version probe.
      description: |
        Returns `ok` once the HTTP API is serving requests. Used by the web UI
        on boot and by `bastion doctor`-style checks; it performs no I/O.
      tags: [system]
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/update:
    get:
      operationId: getUpdateStatus
      summary: Report the release check state.
      description: |
        Returns the running version, the stored consent and the cached check
        result. With consent `unset` or `off` no request is made. With consent
        `on`, a cached result older than 24 hours is refreshed in the
        background; this response carries the cached values immediately.
      tags: [update]
      responses:
        "200":
          description: The current release check state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/update/consent:
    put:
      operationId: setUpdateConsent
      summary: Store the release-check choice.
      description: |
        Only the UI calls this. `enabled: false` stops every future request;
        the choice lives in a small file in the data directory, so no database
        migration is involved. The response is the updated status.
      tags: [update]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUpdateConsentRequest"
      responses:
        "200":
          description: The choice was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/trivy-db:
    get:
      operationId: getTrivyDB
      summary: Report the vulnerability DB state.
      description: |
        Returns the state of the Trivy vulnerability DB a scan needs: `missing`
        when it is not on disk, `downloading` while a download runs, `ready`
        when it is usable, `failed` when the last download failed. This endpoint
        never waits for a download.
      tags: [trivy-db]
      responses:
        "200":
          description: The current DB state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrivyDBStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/trivy-db/download:
    post:
      operationId: downloadTrivyDB
      summary: Start a vulnerability DB download.
      description: |
        Starts one download in the background and returns the state it started
        in (`downloading`). It is idempotent: while a download is in flight,
        whatever started it, the call starts no second one and reports that
        download's state. Scans wait for the DB themselves, so downloading
        ahead of time only shortens them.
      tags: [trivy-db]
      responses:
        "202":
          description: A download is in flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrivyDBStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/connections:
    get:
      operationId: listConnections
      summary: List configured connections.
      description: |
        Returns every connection, ordered by kind and name. Tokens and keyring
        references are never part of the response.
      tags: [connections]
      responses:
        "200":
          description: The configured connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createConnection
      summary: Add a connection and test it.
      description: |
        Stores the token in the OS keyring under `bastion.connection.<id>`, then
        tests it with `GET /user`. A failed test still creates the connection: it
        is returned with `status: error` and a human-readable `hint`, so the user
        can correct the token or keyring without losing the entry. If the token
        cannot be stored, the row is removed again and no connection is created.
      tags: [connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: The connection was created (and tested).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: A connection with the same kind and name already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Remove a connection and its stored secret.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "204":
          description: The connection and its keyring entry were removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Test a connection and record the result.
      description: |
        Calls `GET /user` with the stored token and records `status`,
        `last_checked_at` and the GitHub login in the connection's non-secret
        config. A failed test returns the connection with `status: error` and a
        `hint`; it is not an API error.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: The connection after the test, successful or not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/connections/{id}/discover:
    get:
      operationId: discoverConnectionRepos
      summary: List repositories the connection can add.
      description: |
        Calls GitHub's repository list and marks the ones that already exist as
        assets with `already_added: true`.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: Repositories visible to the connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverReposResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: The connection has no token and the environment fallback is unset.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          description: |
            GitHub rejected or failed the request. `detail` carries the
            human-readable hint from the GitHub client (for example "token
            invalid or expired").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/assets:
    get:
      operationId: listAssets
      summary: List tracked assets.
      description: |
        Every non-archived asset with its newest scan (whatever its status) and
        the open severity counts of its newest succeeded scan. `open_counts`
        uses the dashboard scope: any `finding_states` decision hides its
        finding, and a failed or running newest scan does not shadow the last
        complete report.
      tags: [assets]
      responses:
        "200":
          description: The tracked assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAsset
      summary: Track a repository or a local path.
      description: |
        `repo` resolves the repository's default branch through GitHub with the
        connection's token (`connection_id`, else the default GitHub token) and
        stores it. `path` must be an existing absolute directory.

        Re-adding an archived asset revives that row instead of creating a
        second one: its history, scans and finding decisions stay attached to
        the same id, which fingerprints depend on.
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: The asset was created or revived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: |
            The kind, ref or path is invalid, or a repo asset's default branch
            could not be resolved because GitHub rejected the request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The connection id does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            The asset already exists or the connection has no token; the detail
            says which.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          description: GitHub failed the request; the detail carries the hint.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/assets/{id}:
    delete:
      operationId: deleteAsset
      summary: Archive an asset.
      description: |
        Soft delete: the row, its scans and its findings stay in the database,
        but the asset disappears from the lists, the dashboard and new scans.
      tags: [assets]
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "204":
          description: The asset is archived.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans:
    get:
      operationId: listScans
      summary: List scans, newest first.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/AssetIDQuery"
        - $ref: "#/components/parameters/ScanLimitQuery"
      responses:
        "200":
          description: The scans after the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanList"
        "400":
          description: The asset id or limit is not usable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createScans
      summary: Queue scans of one or more assets.
      description: |
        Every asset id is checked before anything is queued: an unknown or
        archived asset fails the whole request, so the caller never receives a
        partial batch it cannot correlate. The scans run in the server's worker
        pool with `trigger: ui` and can be canceled individually.
      tags: [scans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScansRequest"
      responses:
        "202":
          description: The scans are queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanQueueResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: An asset id does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: An asset is archived and cannot be scanned.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans/{id}:
    get:
      operationId: getScan
      summary: One scan with its scanner runs.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/ScanID"
      responses:
        "200":
          description: The scan, including `scanner_runs`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans/{id}/cancel:
    post:
      operationId: cancelScan
      summary: Cancel a queued or running scan.
      description: |
        A queued scan is persisted as canceled before this responds; a running
        scan stops at its next check and its worker persists the final state.
        The body is the scan as it stood when the request was accepted.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/ScanID"
      responses:
        "200":
          description: The scan after the cancel request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: The scan is already finished or canceled.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans/{id}/findings:
    get:
      operationId: listScanFindings
      summary: Findings of one scan.
      description: |
        Every finding the scan produced, most severe first, with the effective
        status: a `finding_states` decision for the same asset and fingerprint
        reports the finding as `ignored` and fills `state` and `reason`.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/ScanID"
        - $ref: "#/components/parameters/SeverityQuery"
        - $ref: "#/components/parameters/FindingTypeQuery"
        - $ref: "#/components/parameters/FindingStatusQuery"
      responses:
        "200":
          description: The findings after the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "400":
          description: A query parameter is not a valid enum value.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/scans/{id}/diff:
    get:
      operationId: getScanDiff
      summary: Findings new, fixed and persisting between two scans.
      description: |
        Compares `{id}` with `against`, or with the asset's previous succeeded
        scan (the newest succeeded scan older than `{id}`) when `against` is
        omitted. Both scans must be succeeded scans of the same asset: a
        `queued`, `running`, `failed` or `canceled` scan has no complete finding
        set to compare.

        With nothing to compare against — the asset's first succeeded scan —
        the response is still `200`: `against_scan_id` is absent, every finding
        of `{id}` is reported as `new`, and `fixed`, `persisting` and their
        counts are empty.

        Findings are matched by fingerprint. Each group is most severe first,
        then in the order `GET /api/scans/{id}/findings` returns them.
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/ScanID"
        - name: against
          in: query
          required: false
          description: |
            Scan to compare against. Must be a succeeded scan of the same asset.
            Defaults to the previous succeeded scan of the asset.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: |
            The diff, or every finding as new when there is no previous
            succeeded scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanDiff"
        "400":
          description: |
            `against` is not a positive scan id, is `{id}`, or belongs to a
            different asset.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: |
            `{id}` or `against` does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            `{id}` or `against` did not succeed, so it has no complete finding
            set.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/findings/{fingerprint}/state:
    post:
      operationId: setFindingState
      summary: Record a decision for one finding.
      description: |
        Decisions are keyed on (asset_id, fingerprint), so they hide the finding
        in this scan and in every later one that rediscovers it. `reason` is
        required: a hidden finding must stay reviewable. Re-deciding replaces
        the previous state and reason.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/Fingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFindingStateRequest"
      responses:
        "204":
          description: The decision is stored.
        "400":
          description: The state is unknown, the reason is blank or ids are missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The asset id does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearFindingState
      summary: Clear the decision for one finding.
      description: |
        Clearing is a DELETE with `asset_id` in the query, because the decision
        key is (asset_id, fingerprint) and both are needed to identify it.
        Clearing a decision that does not exist succeeds.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/Fingerprint"
        - $ref: "#/components/parameters/AssetIDRequiredQuery"
      responses:
        "204":
          description: No decision is stored for the fingerprint any more.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: The asset id does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/findings:
    get:
      operationId: listFindings
      summary: Latest findings across assets.
      description: |
        Returns the findings of the most recent succeeded scan of every
        non-archived asset (failed, canceled and running scans are skipped),
        most severe first. `status` is the effective status: any
        `finding_states` decision for the same asset and fingerprint reports the
        finding as `ignored` and fills `state` and `reason`, without rewriting
        the stored row.
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/AssetIDQuery"
        - $ref: "#/components/parameters/SeverityQuery"
        - $ref: "#/components/parameters/FindingTypeQuery"
        - $ref: "#/components/parameters/FindingStatusQuery"
      responses:
        "200":
          description: The latest findings, after the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "400":
          description: A query parameter is not a valid asset id or enum value.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/reports/dashboard:
    get:
      operationId: getDashboard
      summary: Dashboard aggregates across non-archived assets.
      description: |
        Totals, the five riskiest assets, a trend of open critical+high findings
        and the last scan of every asset. Every aggregate counts only open
        findings (no `finding_states` decision) of each asset's most recent
        succeeded scan; archived assets are excluded throughout.

        Ignore decisions are keyed on (asset_id, fingerprint) and are applied to
        all scans of the asset, so ignoring a finding also removes it from older
        points of the trend (retroactive) rather than only from the newest point.
      tags: [reports]
      responses:
        "200":
          description: The dashboard aggregates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/events:
    get:
      operationId: streamEvents
      summary: Stream scan lifecycle events.
      description: |
        Server-Sent Events stream of everything the scan queue does
        (PROJECT_SPEC.md §6). Each frame is `event: <type>` plus one
        `data: <ScanEvent JSON>` line, where the event type is `scan.queued`,
        `scan.progress` or `scan.finished`. An idle stream sends a `: ping`
        comment every 15 seconds; comments are not events.

        There is no replay: the stream continues with the next event after it
        opens, so a client that reconnects refetches the state it missed. A
        client that falls too far behind is dropped, so a slow reader can never
        stall a scan worker. Like every other `/api/*` route the stream
        requires the `bastion_session` cookie; mutating-request CSRF does not
        apply to this GET.
      tags: [scans]
      responses:
        "200":
          description: The event stream, open until the client disconnects.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ScanEvent"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "421":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bastion_session
      description: |
        Set by the server when it exchanges the single-use startup token for a
        session. `HttpOnly; SameSite=Strict; Path=/` (no `Secure`, since the
        transport is plain HTTP on loopback). Never sent to or read by the SPA.
  parameters:
    ConnectionID:
      name: id
      in: path
      required: true
      description: Connection id.
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetIDQuery:
      name: asset_id
      in: query
      required: false
      description: Only findings of this asset.
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetIDRequiredQuery:
      name: asset_id
      in: query
      required: true
      description: The asset the decision belongs to.
      schema:
        type: integer
        format: int64
        minimum: 1
    AssetID:
      name: id
      in: path
      required: true
      description: Asset id.
      schema:
        type: integer
        format: int64
        minimum: 1
    ScanID:
      name: id
      in: path
      required: true
      description: Scan id.
      schema:
        type: integer
        format: int64
        minimum: 1
    ScanLimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of scans to return, newest first.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Fingerprint:
      name: fingerprint
      in: path
      required: true
      description: Stable finding fingerprint within one asset.
      schema:
        type: string
        minLength: 1
    SeverityQuery:
      name: severity
      in: query
      required: false
      description: Only findings with this severity.
      schema:
        $ref: "#/components/schemas/Severity"
    FindingTypeQuery:
      name: type
      in: query
      required: false
      description: Only findings of this type.
      schema:
        $ref: "#/components/schemas/FindingType"
    FindingStatusQuery:
      name: status
      in: query
      required: false
      description: Only findings with this effective status.
      schema:
        $ref: "#/components/schemas/FindingStatus"
  responses:
    Problem:
      description: |
        The request was rejected (RFC 9457 problem details). The same shape is
        used for every non-2xx response.
      headers:
        Content-Type:
          description: Always `application/problem+json`.
          schema:
            type: string
            const: application/problem+json
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      title: Health
      description: Liveness of the local API.
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
          description: Always `ok` while the server is accepting requests.
        version:
          type: string
          description: |
            Build version of the running binary (`dev` for local builds,
            otherwise the release tag).
          examples: ["0.1.0"]
    UpdateConsent:
      type: string
      title: UpdateConsent
      description: |
        The user's answer to the release-check question. `unset` and `off` both
        mean no network request; only `on` allows the daily check.
      enum: [unset, on, off]
    UpdateStatus:
      type: object
      title: UpdateStatus
      description: |
        The release check as the UI and the CLI see it. Optional fields are
        absent when there is no successful check or no newer release.
      additionalProperties: false
      required: [current, update_available, consent, disabled]
      properties:
        current:
          type: string
          description: Version of the running binary (`dev` for local builds).
        disabled:
          type: boolean
          description: |
            True when no check can run whatever the consent says
            (`BASTION_NO_UPDATE_CHECK`, a CI environment or a `dev` build). The
            UI then does not ask.
        latest:
          type: string
          description: |
            Newest release tag from the cached check. Absent before the first
            successful check.
        update_available:
          type: boolean
          description: True when `latest` is a newer semver than `current`.
        consent:
          $ref: "#/components/schemas/UpdateConsent"
        command:
          type: string
          description: |
            Command that updates this installation (Homebrew or the install.sh
            one-liner). Absent on Windows and when no update is available.
        release_url:
          type: string
          format: uri
          description: Release-notes page for `latest`; absent when no update is available.
    SetUpdateConsentRequest:
      type: object
      title: SetUpdateConsentRequest
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: True turns the daily release check on; false turns it off.
    TrivyDBState:
      type: string
      title: TrivyDBState
      description: |
        State of the Trivy vulnerability DB. `missing` and `failed` both mean a
        scan downloads it first; only `ready` means scans run straight away.
      enum: [missing, downloading, ready, failed]
    TrivyDBStatus:
      type: object
      title: TrivyDBStatus
      description: |
        The vulnerability DB as the UI and the CLI see it. Optional fields are
        absent when they do not apply to the state.
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/TrivyDBState"
        updated_at:
          type: string
          format: date-time
          description: |
            When the DB was built, from Trivy's metadata. Absent unless the
            state is `ready` and the metadata carries it.
        error:
          type: string
          description: Why the last download failed; present only when `failed`.
        trigger:
          type: string
          description: |
            What started the download in flight, or the last one. Absent before
            the first download.
          enum: [user, scan]
    ConnectionList:
      type: object
      title: ConnectionList
      description: Every configured connection.
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
    Connection:
      type: object
      title: Connection
      description: |
        A configured integration. The credential itself is never part of this
        shape: the token lives in the OS keyring under `secret_ref`, and
        neither the token nor the keyring key is returned by the API.
      additionalProperties: false
      required: [id, kind, name, status, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: "#/components/schemas/ConnectionKind"
        name:
          type: string
          description: User-chosen name, unique per kind.
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        login:
          type: string
          description: |
            GitHub login recorded by the last successful test. Absent when the
            connection has never succeeded.
        hint:
          type: string
          description: |
            Human-readable explanation of the last failed test (never a token
            or a GitHub response body). Absent after a successful test.
        last_checked_at:
          type: string
          format: date-time
          description: When the connection was last tested.
        created_at:
          type: string
          format: date-time
    ConnectionKind:
      type: string
      title: ConnectionKind
      description: |
        Integration kind. v0.1 only creates `github` connections; the other
        values exist because the database and later phases use them.
      enum: [github, aws, docker]
    ConnectionStatus:
      type: string
      title: ConnectionStatus
      description: Result of the last test.
      enum: [ok, error, unknown]
    CreateConnectionRequest:
      type: object
      title: CreateConnectionRequest
      additionalProperties: false
      required: [kind, name, token]
      properties:
        kind:
          type: string
          description: Only `github` can be created in v0.1.
          enum: [github]
        name:
          type: string
          minLength: 1
          description: User-chosen name, unique per kind.
        token:
          type: string
          writeOnly: true
          minLength: 1
          description: |
            GitHub personal access token (classic or fine-grained, read-only).
            Stored in the OS keyring, never persisted in SQLite, logged or
            returned by the API.
    DiscoverReposResponse:
      type: object
      title: DiscoverReposResponse
      additionalProperties: false
      required: [repos]
      properties:
        repos:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredRepo"
    DiscoveredRepo:
      type: object
      title: DiscoveredRepo
      description: A repository the connection can add as an asset.
      additionalProperties: false
      required: [full_name, default_branch, private, archived, already_added]
      properties:
        full_name:
          type: string
          description: Canonical `owner/repo` reference.
          examples: ["octo/hello"]
        default_branch:
          type: string
          examples: ["main"]
        private:
          type: boolean
        archived:
          type: boolean
        already_added:
          type: boolean
          description: |
            True when an asset with this `owner/repo` reference already exists,
            whichever connection (or the CLI) added it.
    Severity:
      type: string
      title: Severity
      description: Normalized severity scale (`unknown` when a scanner gave no usable level).
      enum: [critical, high, medium, low, unknown]
    FindingType:
      type: string
      title: FindingType
      description: Kind of finding (PROJECT_SPEC.md §5).
      enum: [vulnerability, secret, outdated, misconfig, license, malware, sast]
    FindingStatus:
      type: string
      title: FindingStatus
      description: |
        Effective status. Any `finding_states` decision for the same asset and
        fingerprint reports the finding as `ignored`; the decision itself is in
        `state`.
      enum: [open, ignored]
    FindingState:
      type: string
      title: FindingState
      description: The user decision that hides a finding across scans.
      enum: [ignored, accepted_risk, false_positive]
    AssetKind:
      type: string
      title: AssetKind
      description: What the asset is.
      enum: [repo, image, path]
    ScanStatus:
      type: string
      title: ScanStatus
      description: Lifecycle state of a scan.
      enum: [queued, running, succeeded, failed, canceled]
    Finding:
      type: object
      title: Finding
      description: |
        One normalized finding of an asset's latest succeeded scan. Optional
        fields are absent when the scanner did not provide them.
      additionalProperties: false
      required:
        [id, asset_id, scan_id, fingerprint, type, severity, title, occurrences, scanner, scanners, status, references]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        asset_id:
          type: integer
          format: int64
          minimum: 1
        scan_id:
          type: integer
          format: int64
          minimum: 1
        fingerprint:
          type: string
          description: |
            Stable identifier of the finding across scans (PROJECT_SPEC.md §5).
        type:
          $ref: "#/components/schemas/FindingType"
        severity:
          $ref: "#/components/schemas/Severity"
        title:
          type: string
        rule_id:
          type: string
          description: CVE, GHSA or scanner rule id.
        package_name:
          type: string
        package_version:
          type: string
        fixed_version:
          type: string
          description: Version that closes the finding, when the advisory knows one.
        ecosystem:
          type: string
          examples: ["npm", "go", "deb"]
        location:
          type: string
          description: |
            Display location: `file:line` (line is display only), file plus
            cause for misconfigurations, or the package path inside an image.
        occurrences:
          type: integer
          minimum: 1
          description: Raw occurrences merged into this finding within one scan.
        scanner:
          type: string
          description: |
            Primary scanner. Its fingerprint is the one stored, so it stays
            stable when another scanner reports the same advisory.
        scanners:
          type: array
          description: |
            Every scanner that reported the finding. A CVE reported by both
            Trivy and OSV appears once with both entries; `scanner` is the
            primary one.
          items:
            type: string
        status:
          $ref: "#/components/schemas/FindingStatus"
        state:
          $ref: "#/components/schemas/FindingState"
        reason:
          type: string
          description: The user's reason for the decision in `state`.
        first_seen_scan_id:
          type: integer
          format: int64
          description: Scan that reported this fingerprint for the asset first.
        description:
          type: string
        references:
          type: array
          description: Advisory or rule references; `[]` when there are none.
          items:
            type: string
    FindingList:
      type: object
      title: FindingList
      additionalProperties: false
      required: [findings]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
    Dashboard:
      type: object
      title: Dashboard
      description: |
        Aggregates for §7.1. Every number counts open findings of each
        non-archived asset's latest succeeded scan.
      additionalProperties: false
      required: [totals_by_severity, totals_by_type, top_assets, trend, last_scans]
      properties:
        totals_by_severity:
          $ref: "#/components/schemas/SeverityTotals"
        totals_by_type:
          $ref: "#/components/schemas/TypeTotals"
        top_assets:
          type: array
          description: Up to five assets, riskiest first.
          items:
            $ref: "#/components/schemas/AssetRisk"
        trend:
          type: array
          description: |
            Per asset, the open critical+high count of its last ten succeeded
            scans, oldest first. Ignore decisions apply to every point.
          items:
            $ref: "#/components/schemas/AssetTrend"
        last_scans:
          type: array
          description: |
            The newest scan of every non-archived asset that has one, whatever
            its status (a failed last scan is shown as failed).
          items:
            $ref: "#/components/schemas/LastScan"
    SeverityTotals:
      type: object
      title: SeverityTotals
      description: Findings per severity; severities without findings are zero.
      additionalProperties: false
      required: [critical, high, medium, low, unknown]
      properties:
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        medium:
          type: integer
          minimum: 0
        low:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
    ScanDiff:
      type: object
      title: ScanDiff
      description: |
        Change in findings between two scans of the same asset, matched by
        fingerprint. `new` and `persisting` come from `scan_id`; `fixed` comes
        from `against_scan_id`. Without a scan to compare against,
        `against_scan_id` is absent, every finding is `new`, and the other
        groups and counts are empty.
      additionalProperties: false
      required: [scan_id, new, fixed, persisting, counts]
      properties:
        scan_id:
          type: integer
          format: int64
          minimum: 1
        against_scan_id:
          type: integer
          format: int64
          minimum: 1
          description: The scan compared against; absent when there is none.
        new:
          type: array
          description: Findings only in `scan_id`, most severe first.
          items:
            $ref: "#/components/schemas/Finding"
        fixed:
          type: array
          description: Findings only in `against_scan_id`, most severe first.
          items:
            $ref: "#/components/schemas/Finding"
        persisting:
          type: array
          description: |
            Fingerprints in both scans, taken from `scan_id`, most severe first.
          items:
            $ref: "#/components/schemas/Finding"
        counts:
          $ref: "#/components/schemas/ScanDiffCounts"
    ScanDiffCounts:
      type: object
      title: ScanDiffCounts
      description: |
        Findings per severity in each diff group; an empty group is all zeros.
      additionalProperties: false
      required: [new, fixed, persisting]
      properties:
        new:
          $ref: "#/components/schemas/SeverityTotals"
        fixed:
          $ref: "#/components/schemas/SeverityTotals"
        persisting:
          $ref: "#/components/schemas/SeverityTotals"
    TypeTotals:
      type: object
      title: TypeTotals
      description: Open findings per type; types without findings are zero.
      additionalProperties: false
      required: [vulnerability, secret, outdated, misconfig, license, malware, sast]
      properties:
        vulnerability:
          type: integer
          minimum: 0
        secret:
          type: integer
          minimum: 0
        outdated:
          type: integer
          minimum: 0
        misconfig:
          type: integer
          minimum: 0
        license:
          type: integer
          minimum: 0
        malware:
          type: integer
          minimum: 0
        sast:
          type: integer
          minimum: 0
    AssetRisk:
      type: object
      title: AssetRisk
      description: |
        One asset's open findings and risk score
        (`critical*1000 + high*100 + medium*10 + low`). Assets whose open
        findings are all `unknown` severity score 0 and are not listed.
      additionalProperties: false
      required: [asset_id, display_name, kind, score, critical, high, medium, low]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
        kind:
          $ref: "#/components/schemas/AssetKind"
        score:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        medium:
          type: integer
          minimum: 0
        low:
          type: integer
          minimum: 0
    AssetTrend:
      type: object
      title: AssetTrend
      description: One asset's trend series.
      additionalProperties: false
      required: [asset_id, scans]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
        scans:
          type: array
          description: Up to ten succeeded scans, oldest first.
          items:
            $ref: "#/components/schemas/TrendScan"
    TrendScan:
      type: object
      title: TrendScan
      additionalProperties: false
      required: [scan_id, critical_high_open]
      properties:
        scan_id:
          type: integer
          format: int64
          minimum: 1
        finished_at:
          type: string
          format: date-time
          description: Absent only for data written outside a finished scan.
        critical_high_open:
          type: integer
          minimum: 0
    LastScan:
      type: object
      title: LastScan
      additionalProperties: false
      required: [asset_id, display_name, scan_id, status]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
        scan_id:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/ScanStatus"
        finished_at:
          type: string
          format: date-time
          description: Absent while the scan has not finished.
    AssetList:
      type: object
      title: AssetList
      description: Every non-archived asset.
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
    Asset:
      type: object
      title: Asset
      description: One tracked repository or path.
      additionalProperties: false
      required: [id, kind, display_name, ref, created_at, open_counts]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: "#/components/schemas/AssetKind"
        connection_id:
          type: integer
          format: int64
          minimum: 1
          description: The connection repo scans authenticate with.
        display_name:
          type: string
        ref:
          type: string
          description: |
            Canonical reference: `owner/repo` for repositories, the absolute
            directory for paths.
        default_branch:
          type: string
          description: Branch the repository tracks; absent for paths.
        created_at:
          type: string
          format: date-time
        last_scan:
          $ref: "#/components/schemas/AssetLastScan"
        open_counts:
          $ref: "#/components/schemas/SeverityTotals"
    AssetLastScan:
      type: object
      title: AssetLastScan
      description: |
        The asset's newest scan, whatever its status: a failed newest scan is
        what the asset list must show.
      additionalProperties: false
      required: [scan_id, status]
      properties:
        scan_id:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/ScanStatus"
        finished_at:
          type: string
          format: date-time
          description: Absent while the scan has not finished.
    CreateAssetRequest:
      type: object
      title: CreateAssetRequest
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
          description: |
            `repo` takes an `owner/repo` ref; `path` takes an existing absolute
            directory. Images arrive in a later phase.
          enum: [repo, path]
        ref:
          type: string
          minLength: 1
          description: "`owner/repo` for repositories, an absolute directory for paths."
          examples: ["octo/hello", "/Users/me/src/hello"]
        connection_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            Connection whose token resolves the default branch and authenticates
            scans. Absent uses the default GitHub token.
    ScanList:
      type: object
      title: ScanList
      description: Scans, newest first.
      additionalProperties: false
      required: [scans]
      properties:
        scans:
          type: array
          items:
            $ref: "#/components/schemas/Scan"
    Scan:
      type: object
      title: Scan
      description: |
        One scan of one asset. `counts` are every finding this scan recorded,
        per severity; decisions on the asset do not rewrite history, and a scan
        that recorded nothing is all zeros. `scanner_runs` is filled by the
        single-scan read only; the list omits it.
      additionalProperties: false
      required: [id, asset_id, status, trigger, counts]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        asset_id:
          type: integer
          format: int64
          minimum: 1
        target_ref:
          type: string
          description: Resolved git SHA or image digest at scan time, when known.
        status:
          $ref: "#/components/schemas/ScanStatus"
        trigger:
          type: string
          description: Who started the scan.
          enum: [ui, cli, api]
        started_at:
          type: string
          format: date-time
          description: Absent while the scan is still queued.
        finished_at:
          type: string
          format: date-time
          description: Absent while the scan has not finished.
        error:
          type: string
          description: Why a failed scan failed; absent otherwise.
        counts:
          $ref: "#/components/schemas/SeverityTotals"
        scanner_runs:
          type: array
          description: One entry per scanner, in execution order (single-scan read only).
          items:
            $ref: "#/components/schemas/ScannerRun"
    ScannerRun:
      type: object
      title: ScannerRun
      description: One scanner's result inside a scan.
      additionalProperties: false
      required: [scanner, status]
      properties:
        scanner:
          type: string
        scanner_version:
          type: string
        db_version:
          type: string
          description: Version of the advisory database the scanner used.
        status:
          $ref: "#/components/schemas/ScanStatus"
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
          description: Why this scanner failed; absent otherwise.
    CreateScansRequest:
      type: object
      title: CreateScansRequest
      additionalProperties: false
      required: [asset_ids]
      properties:
        asset_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
    ScanQueueResult:
      type: object
      title: ScanQueueResult
      additionalProperties: false
      required: [scans]
      properties:
        scans:
          type: array
          items:
            $ref: "#/components/schemas/QueuedScan"
    QueuedScan:
      type: object
      title: QueuedScan
      description: The scan id the caller tracks the queued scan by.
      additionalProperties: false
      required: [scan_id, asset_id]
      properties:
        scan_id:
          type: integer
          format: int64
          minimum: 1
        asset_id:
          type: integer
          format: int64
          minimum: 1
    SetFindingStateRequest:
      type: object
      title: SetFindingStateRequest
      additionalProperties: false
      required: [asset_id, state, reason]
      properties:
        asset_id:
          type: integer
          format: int64
          minimum: 1
          description: The asset the finding belongs to; decisions are per asset.
        state:
          $ref: "#/components/schemas/FindingState"
        reason:
          type: string
          minLength: 1
          description: Why the finding is hidden; required, so decisions stay reviewable.
    Problem:
      type: object
      title: Problem
      description: |
        RFC 9457 problem details. Extension members are allowed and may be
        added later without a breaking change.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: |
            A URI reference identifying the problem type. `about:blank` means
            the problem carries no more meaning than the HTTP status code.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this specific occurrence.
    ScanEvent:
      type: object
      title: ScanEvent
      description: |
        One scan lifecycle event, carried in the `data:` line of an
        `/api/events` frame. Optional fields are absent when they do not apply
        to the event type.
      additionalProperties: false
      required: [type, scan_id, asset_id, status]
      properties:
        type:
          type: string
          description: The SSE event name.
          enum: [scan.queued, scan.progress, scan.finished]
        scan_id:
          type: integer
          format: int64
          minimum: 1
        asset_id:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/ScanStatus"
        stage:
          type: string
          description: Pipeline stage of a `scan.progress` event.
          enum: [resolve, fetch, scan, normalize, wait_db]
        scanner:
          type: string
          description: Scanner a `scan.progress` event belongs to, when any.
        error:
          type: string
          description: Why the scan failed, on a failed `scan.finished` event.
