# oapi-codegen configuration for api/openapi.yaml (PROJECT_SPEC.md §3, §9).
# Run through `make gen`, never by hand.
package: gen
output: internal/httpapi/gen/api.gen.go
generate:
  # stdlib net/http (Go 1.22+ method patterns) — no web framework (§3).
  std-http-server: true
  # Typed request/response objects, so handlers cannot forget a status code.
  strict-server: true
  models: true
output-options:
  skip-prune: true
  # /api/events is a hand-written streaming handler (internal/httpapi/events.go):
  # the generated strict server writes one response per handler call and cannot
  # flush per event. The operation stays in the spec as documentation.
  # /api/scans/{id}/sbom is hand-written too (internal/httpapi/sbom.go): the
  # strict server cannot set the Content-Disposition header the download needs.
  exclude-operation-ids:
    - streamEvents
    - getScanSBOM
